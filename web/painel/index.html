/* ============================ A BARRA DO TELEFONE ======================= */
/* ======================== A VISTA DE CONFIGURAÇÃO ======================== *
 *
 * PORQUE É UMA VISTA E NÃO UM DIÁLOGO. O que muda um interruptor é diálogo (o da configuração, na linha do par);
 * o que muda um DOCUMENTO é vista. A ficha tem regras de identidade, tipos, bandas e um veredicto de um conferidor
 * que NÃO é esta tela: isso cabe numa vista, cresce com cada plugin (o questionário é do PLUGIN, não da tela) e
 * não cabe numa caixa.
 *
 * O QUE ELA NÃO FAZ, e é a razão de estar escrita assim: NÃO ESCREVE NADA e NÃO JULGA NADA. Copia a conta e as
 * fichas do fio e mostra o relatório do conferidor TAL E QUAL — o veredicto é dele. Onde se muda o estado hoje
 * está escrito com o comando à vista: uma porta só, a mesma que o gesto do dono já usa.
 */
/** Um objecto qualquer (a conta, o cabeçalho de uma ficha) desenhado como «chave → valor», sem formatar valores.
 *  Em modo de composição, o valor vira CAMPO — menos as três chaves de identidade (`conta`, `instrumento`, `setup`),
 *  que não se editam: mudá-las não é editar a ficha, é RENOMEAR o ficheiro, e o nome tem de bater com o cabeçalho
 *  (senão o operador recusa — é uma das três regras de identidade). */
const CHAVES_DE_IDENTIDADE = ["cabecalho.conta", "cabecalho.instrumento", "cabecalho.setup"];
function linhasDoObjeto(o, prefixo = "", compor = false, f = null) {
  return Object.entries(o).map(([k, v]) => {
    const chave = prefixo === "" ? k : `${prefixo}.${k}`;
    if (v !== null && typeof v === "object" && !Array.isArray(v)) return linhasDoObjeto(v, chave, compor, f);
    const podeEditar = compor && !CHAVES_DE_IDENTIDADE.includes(chave);
    // EM COMPOSIÇÃO, O CAMPO MOSTRA O QUE O DONO ESCREVEU — e não o que está na ficha. É isto que faz sobreviver
    // o que foi escrito a um redesenho (o retrato renova a cada minuto e o desenho é refeito): a composição vive
    // numa variável, não no DOM.
    const valorDeVerdade = v;
    const mostrado = podeEditar && f !== null ? valorComposto(f.caminho, chave, valorDeVerdade) : valorDeVerdade;
    const valor = Array.isArray(mostrado) ? mostrado.join(" · ") : mostrado === true ? "sim" : mostrado === false ? "não" : String(mostrado);
    // O valor que o leitor escondeu por parecer segredo aparece DITO, não em branco: um buraco silencioso num
    // painel deixa sempre a dúvida de se o campo não existe ou se foi escondido.
    const escondido = valor === "(nao se mostra)";
    const campo = !podeEditar
      ? `<span class="valor mono ${escondido ? "aviso" : ""}">${escapar(escondido ? "(escondido: parece segredo)" : valor)}${
          compor && CHAVES_DE_IDENTIDADE.includes(chave) ? ` <span class="fraco mini">(identidade — não se edita aqui)</span>` : ""
        }</span>`
      : typeof valorDeVerdade === "boolean" || chave === "cabecalho.ao_desligar"
        ? `<select data-chave="${escapar(chave)}">${
            (chave === "cabecalho.ao_desligar" ? ["fechar", "manter"] : ["true", "false"])
              .map((op) => `<option value="${op}" ${String(mostrado) === op ? "selected" : ""}>${
                op === "true" ? "sim" : op === "false" ? "não" : op}</option>`).join("")
          }</select>`
        : `<input type="text" inputmode="decimal" data-chave="${escapar(chave)}" value="${escapar(String(mostrado))}">`;
    return `<div class="item-de-config${podeEditar ? " composto" : ""}"><span class="nome-do-item">${escapar(chave)}</span>${campo}</div>`;
  }).join("");
}

/* ---- A ESCRITA: compor, VALIDAR, e só então escrever (RN-E12 · RN-M2) ----------------------------------
 *
 * O CAMINHO É SEMPRE O MESMO, e a ordem não se troca: **compor** (o dono mexe nos campos) → **validar** (o
 * conferidor do portão corre sobre o CANDIDATO, numa cópia da árvore das fichas) → **escrever** (o mesmo escritor,
 * a sério, com a impressão do ficheiro que se viu). Quem valida e quem escreve é o `tools/escrever-ficha` — esta
 * tela não tem uma segunda conta das regras, e não escreve nada por si: PEDE.
 *
 * A COMPOSIÇÃO VIVE NUMA VARIÁVEL, e não no DOM, pela mesma razão que o estado dos cartões: o retrato renova a
 * cada minuto e o desenho é refeito — um campo que só existisse no DOM perdia o que o dono escreveu.
 */
let fichaEmComposicao = null;
const composicao = new Map(); // caminho -> { chave: valor que o dono escreveu }
const respostas = new Map();  // caminho -> a última resposta do escritor

function valorNoCaminho(o, chave) {
  let atual = o;
  for (const parte of chave.split(".")) {
    if (atual === null || typeof atual !== "object" || !(parte in atual)) return undefined;
    atual = atual[parte];
  }
  return atual;
}
function valorComposto(caminho, chave, seNaoHouver) {
  const c = composicao.get(caminho);
  return c !== undefined && Object.prototype.hasOwnProperty.call(c, chave) ? c[chave] : seNaoHouver;
}
/** As mudanças que o dono compôs — e só o que DIFERE do que está na ficha: o resto não viaja. */
function asMudancas(caminho) {
  const f = (dados?.configuracao?.fichas ?? []).find((x) => x.caminho === caminho);
  if (!f) return {};
  const mudancas = {};
  for (const [chave, bruto] of Object.entries(composicao.get(caminho) ?? {})) {
    const atual = valorNoCaminho(f, chave);
    // O TIPO É O DA FICHA: um booleano fica booleano, um inteiro fica inteiro, e um decimal fica TEXTO (D4).
    const novo = typeof atual === "boolean" ? bruto === true || bruto === "true" : typeof atual === "number" ? Number(bruto) : bruto;
    if (JSON.stringify(novo) !== JSON.stringify(atual)) mudancas[chave] = novo;
  }
  return mudancas;
}

async function falarComOEscritor(corpo) {
  try {
    const r = await fetch("/api/ficha", {
      method: "POST",
      headers: { "content-type": "application/json", "x-mesacore": "1" },
      body: JSON.stringify(corpo),
    });
    return await r.json();
  } catch (e) {
    return { ok: false, porque: `não se conseguiu falar com o escritor (${e instanceof Error ? e.message : String(e)})` };
  }
}

/** O que o escritor respondeu, à vista: o que muda, o veredicto, o relatório dele e o que se fez. */
function blocoDaResposta(r) {
  const dif = (r.diferencas ?? []).map((d) => `<div class="item-de-config"><span class="nome-do-item">${escapar(d.chave)}</span>
    <span class="valor mono">${escapar(String(d.de))} <span class="fraco">→</span> <b>${escapar(String(d.para))}</b></span></div>`).join("");
  const v = r.veredicto ?? null;
  const veredicto = v === null ? "" : `<div class="mini fraco" style="margin-top:6px">conferidor do portão: ${
      v.correu ? `código ${v.codigo}` : "não correu"
    } · ${v.estaFichaAprovou === true ? "esta ficha passou" : v.estaFichaAprovou === false ? "<b>esta ficha REPROVOU</b>" : "sem veredicto desta ficha"}</div>
    <details class="relatorio"><summary>o que ele disse</summary><pre class="relatorio-do-conferidor">${escapar(v.saida ?? "")}</pre></details>`;
  return `<div class="resultado ${r.ok ? "bom" : "mau"}">
    <div class="mini"><b>${r.escrito ? "ESCRITO — e registado" : r.ok ? "validado: nada foi escrito" : "RECUSADO"}</b>${r.porque ? ` — ${escapar(r.porque)}` : ""}</div>
    ${dif}
    ${veredicto}
  </div>`;
}

/** O que cada botão faz. A tela PEDE; quem decide é o escritor. */
async function agirNaFicha(acao, caminho) {
  if (acao === "compor") { fichaEmComposicao = caminho; respostas.delete(caminho); desenharAConfiguracao(); return; }
  if (acao === "cancelar") { fichaEmComposicao = null; composicao.delete(caminho); respostas.delete(caminho); desenharAConfiguracao(); return; }

  const mudancas = asMudancas(caminho);
  if (Object.keys(mudancas).length === 0) {
    respostas.set(caminho, { ok: false, porque: "não mudaste nada ainda (os campos estão iguais aos da ficha)" });
    desenharAConfiguracao();
    return;
  }
  const f = (dados?.configuracao?.fichas ?? []).find((x) => x.caminho === caminho);
  if (acao === "validar") {
    respostas.set(caminho, { aviso: "a validar…" });
    desenharAConfiguracao();
    respostas.set(caminho, await falarComOEscritor({ ficha: caminho, mudancas, visto: f?.hash ?? null, simular: true }));
    desenharAConfiguracao();
    return;
  }
  if (acao === "escrever") {
    // A IMPRESSÃO VAI SEMPRE: se a ficha mudou desde que a página a leu, o escritor recusa e diz porquê.
    const r = await falarComOEscritor({ ficha: caminho, mudancas, visto: f?.hash ?? null, simular: false });
    respostas.set(caminho, r);
    if (r.ok === true) { fichaEmComposicao = null; composicao.delete(caminho); }
    desenharAConfiguracao();
    if (r.ok === true) carregar(); // o retrato novo mostra a ficha como ela ficou
  }
}

function desenharAConfiguracao() {
  const c = dados?.configuracao ?? null;
  const caixa = document.getElementById("config-corpo");
  document.getElementById("config-do-retrato").textContent = `do retrato de ${hora(dados?.retrato?.gerado_em_ms)}`;
  if (c === null) {
    caixa.innerHTML = `<div class="aviso">o retrato não traz a configuração: não há conta nem fichas para mostrar</div>`;
    return;
  }
  const conta = c.conta ?? null;
  const veredicto = c.conferidor?.correu
    ? (c.conferidor.codigo === 0
      ? { classe: "vivo", texto: "aprovou" }
      : { classe: "teste", texto: `reprovou (código ${c.conferidor.codigo})` })
    : { classe: "teste", texto: "não correu" };
  caixa.innerHTML = `
    <section class="bloco" data-recolhivel="config:conta">
      <header><span class="mini">A conta</span>
        <span class="contagem mini caminho-da-ficha">${escapar(conta?.caminho ?? "(sem conta)")}</span>
        ${botaoDeRecolher("config:conta", "a conta")}</header>
      <div class="corpo">
        ${conta === null || conta?.existe !== true
          ? `<div class="aviso">o ficheiro da conta não existe neste repositório (${escapar(conta?.caminho ?? "?")}) — a mesa corre com a conta que a operação nomear</div>`
          : linhasDoObjeto(conta.conteudo ?? {})}
        <div class="mini fraco" style="margin-top:8px">
          O segredo não passa por aqui: a conta aponta para ele por <b>caminho</b>, e esta tela não abre o ficheiro
          do segredo.${c.segredos_escondidos > 0 ? ` ${c.segredos_escondidos} valor(es) escondido(s) por parecerem segredo.` : ""}
        </div>
      </div>
    </section>

    <section class="bloco" data-recolhivel="config:fichas">
      <header><span class="mini">As fichas dos pares</span><span class="contagem mini">${c.fichas.length}</span>
        ${botaoDeRecolher("config:fichas", "as fichas dos pares")}</header>
      <div class="corpo">
        ${c.fichas.length === 0 ? `<div class="aviso">nenhuma ficha no repositório — um par sem ficha não entra na operação</div>` : ""}
        ${c.fichas.map((f) => {
          const compor = fichaEmComposicao === f.caminho;
          const resposta = respostas.get(f.caminho) ?? null;
          return `
          <div class="secao" data-ficha="${escapar(f.caminho)}">
            <h3><span>${escapar(f.cabecalho?.instrumento ?? "?")} · ${escapar(f.cabecalho?.setup ?? "?")}</span>
              <span class="mini fraco caminho-da-ficha">${escapar(f.caminho)}</span></h3>
            <div class="dentro-da-secao">
              ${linhasDoObjeto(f.cabecalho ?? {}, "cabecalho", compor, f)}
              <div class="mini fraco" style="margin:8px 0 4px">constantes — as do indicador, e as únicas que vão ao setup (com o relógio)</div>
              ${linhasDoObjeto(f.constantes ?? {}, "constantes", compor, f)}
              <div class="botoes-da-ficha">
                ${compor
                  ? `<button class="botao" data-acao="validar" data-ficha="${escapar(f.caminho)}">validar a mudança</button>
                     <button class="botao" data-acao="cancelar" data-ficha="${escapar(f.caminho)}">deixar como estava</button>
                     ${resposta?.ok && !resposta.escrito ? `<button class="botao escreve" data-acao="escrever" data-ficha="${escapar(f.caminho)}">escrever a ficha</button>` : ""}`
                  : `<button class="botao" data-acao="compor" data-ficha="${escapar(f.caminho)}">mudar esta ficha</button>
                     ${resposta?.escrito ? `<span class="selo vivo sem-ponto">escrita — e registada</span>` : ""}`}
              </div>
              ${resposta ? blocoDaResposta(resposta) : ""}
            </div>
          </div>`;
        }).join("")}
      </div>
    </section>

    <section class="bloco" data-recolhivel="config:conferidor">
      <header><span class="mini">O que o conferidor diz</span>
        <span class="contagem mini"><span class="selo ${veredicto.classe} sem-ponto">${escapar(veredicto.texto)}</span></span>
        ${botaoDeRecolher("config:conferidor", "o conferidor")}</header>
      <div class="corpo">
        <div class="mini fraco">o mesmo conferidor do portão (<code>tools/verificar-setup/fichas.py</code>) — esta tela não reimplementa as regras dele</div>
        <pre class="relatorio-do-conferidor">${escapar(c.conferidor?.saida ?? "")}</pre>
      </div>
    </section>

    <section class="bloco" data-recolhivel="config:escrita">
      <header><span class="mini">Como isto escreve (e o que o guarda)</span>${botaoDeRecolher("config:escrita", "a escrita")}</header>
      <div class="corpo">
        <div class="mini fraco">
          Escrever uma ficha é o gesto do dono, e passa por <b>uma porta só</b>: o mesmo escritor da linha de
          comando (<code>tools/escrever-ficha</code>), que <b>valida o candidato antes de tocar no ficheiro</b> — com
          o conferidor do portão, sobre uma cópia da árvore — e deixa a mudança <b>registada</b> com a hora, a
          origem, o antes e o depois (RN-E12 · RN-M2). Se o conferidor reprovar, não se escreve nada.
        </div>
        <code class="comando mono">${escapar(c.porta_que_escreve ?? "")}</code>
        <div class="mini fraco">
          Três guardas, e nenhum é enfeite: <b>a validação</b> antes de aplicar; <b>a impressão</b> do ficheiro que
          se viu (uma página velha não passa por cima de uma mudança nova); e o pedido só é aceite <b>vindo desta
          tela</b> — outra página aberta na rede não escreve fichas em nome de quem tem o painel aberto.
        </div>
        <div class="mini fraco">
          <b>rodar</b> decide se o par é calculado; <b>enviar</b> decide se o que ele propõe chega ao venue — e é o
          interruptor que a mesa lê a cada ciclo. <b>ao_desligar</b> decide o que acontece à posição viva de um par
          retirado (<code>fechar</code> fecha-a; <code>manter</code> deixa-a, declaradamente). A <b>conta</b> e a
          <b>identidade da ficha</b> (conta, instrumento, setup) não se editam aqui: mudá-las é renomear o ficheiro,
          e o nome tem de bater com o cabeçalho — o operador recusa se não bater.
        </div>
      </div>
    </section>`;
  // Os botões desta vista nascem agora: ligam-se no mesmo sítio que os da bancada.
  aplicarOsEstadosDeRecolher();
  ligarOsBotoesDeRecolher();
  // OS CAMPOS E OS BOTÕES DA ESCRITA, ligados DEPOIS de desenhar: o desenho reescreve o HTML todo e um campo novo
  // nasceria sem gesto (é o mesmo cuidado que os botões de recolher levam).
  for (const campo of caixa.querySelectorAll("[data-chave]")) {
    campo.oninput = campo.onchange = () => {
      const ficha = campo.closest("[data-ficha]")?.dataset.ficha;
      if (ficha === undefined) return;
      const c = composicao.get(ficha) ?? {};
      c[campo.dataset.chave] = campo.value;
      composicao.set(ficha, c);
      // MEXER NUMA CHAVE INVALIDA O VEREDICTO ANTERIOR — e o botão de escrever sai no mesmo gesto. Continuar a
      // oferecer «escrever» sobre um texto que ninguém validou seria oferecer um botão que já não corresponde ao que
      // está composto (o escritor voltaria a validar de qualquer forma, mas o dono estaria a decidir sobre outra
      // coisa, e essa é a pior das duas).
      respostas.delete(ficha);
      for (const b of caixa.querySelectorAll(`[data-acao="escrever"][data-ficha="${CSS.escape(ficha)}"]`)) b.remove();
    };
  }
  for (const b of caixa.querySelectorAll("[data-acao]")) {
    b.onclick = () => { void agirNaFicha(b.dataset.acao ?? "", b.dataset.ficha ?? ""); };
  }
}

/** O endereço é a vista: `#configuracao` mostra a configuração, tudo o resto mostra a bancada. */
function aplicarAVista() {
  const naConfiguracao = location.hash === "#configuracao";
  document.body.dataset.vista = naConfiguracao ? "configuracao" : "painel";
  document.getElementById("vista-de-config").hidden = !naConfiguracao;
  if (naConfiguracao) {
    desenharAConfiguracao();
  } else {
    desenharBarraDoTelefone(); // ela volta a decidir por si (no computador não aparece de todo)
    reencaixarEmBreve();
  }
}
addEventListener("hashchange", aplicarAVista);

function desenharBarraDoTelefone() {
  const i = instrumentoAtual();
  if (!i) return;
  document.getElementById("barra-do-telefone").innerHTML = `
    <span class="quem mono fraco">${escapar(i.instrumento)} · rodar ${i.ficha?.run ? "sim" : "não"} · enviar ${i.ficha?.enviar ? "sim" : "não"}</span>
    <button class="botao" id="bt-par">${i.ficha?.run ? "Retirar par" : "Ligar par"}</button>
    <button class="botao" id="bt-rec">Recarregar</button>`;
  // O gesto está AQUI, nomeado, mas quem o executa é a linha de comando que ESPECIFICA o contrato — e a tela
  // di-lo em vez de escrever a ficha por baixo do pano (RN-E12: a escrita exige validação e assinatura).
  document.getElementById("bt-par").onclick = () => {
    const cmd = `bash tools/ligar-par.sh ${i.instrumento} ${i.ficha?.run ? "nao" : "sim"}`;
    navigator.clipboard?.writeText(cmd);
    alert(`O gesto do dono é uma linha (copiada):\n\n${cmd}\n\nA tela ainda NÃO escreve a ficha: a edição exige validação e assinatura (RN-M2).`);
  };
  document.getElementById("bt-rec").onclick = carregar;
}

/* ============================ O ARRANQUE ================================ */
async function carregar() {
  try {
    const r = await fetch(`painel.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    dados = await r.json();
  } catch (e) {
    document.getElementById("fita").innerHTML =
      `<div class="marca"><b>MesaCore</b><span class="selo teste">sem retrato</span></div>
       <div class="fraco" style="margin-left:auto">não consegui ler <code>painel.json</code> (${escapar(e.message)}). O painel é servido pelo sistema: corra <code class="mono">bun run tools/painel/retrato.ts</code> e recarregue.</div>`;
    return;
  }
  if (!selecionado || !dados.mesas[0].contas[0].instrumentos.some((i) => i.instrumento === selecionado)) {
    selecionado = dados.mesas[0].contas[0].instrumentos[0]?.instrumento ?? null;
  }
  desenharFita();
  desenharPares();
  desenharGrafico();
  desenharODentro();
  desenharRegistoEFaltas();
  desenharBarraDoTelefone();
  // TUDO O QUE RECOLHE, no fim de desenhar: os contentores ganham o estado guardado e os botões ganham o gesto.
  // Fica aqui, num sítio só, porque o desenho reescreve o HTML (o retrato renova a cada minuto) e os botões
  // novos nasceriam mortos.
  aplicarOsEstadosDeRecolher();
  ligarOsBotoesDeRecolher();
  reencaixarEmBreve(); // o desenho mudou a altura do que está por cima do gráfico: mede-se de novo
  aplicarAVista();     // e a vista que o endereço pede é redesenhada com o retrato novo
}

// O desenho segue o tema: se as variáveis mudarem (outro tema no futuro), o gráfico repinta com as MESMAS
// variáveis — nenhum hex vive neste ficheiro, e nenhum canvas fica com a paleta antiga.
new MutationObserver(() => { if (grafico) { grafico.applyOptions({ layout: { background: { color: cor("--fundo") }, textColor: cor("--tinta-fraca") } }); } })
  .observe(document.documentElement, { attributes: true, attributeFilter: ["data-tema", "class"] });
addEventListener("resize", ajustarAlturaDosPainéis);
addEventListener("orientationchange", reencaixarEmBreve);
// OS GESTOS DO DIÁLOGO, ligados uma só vez: o botão de fechar, o veu (clicar fora fecha — é o que a mão tenta
// primeiro) e o `Esc` (que é o que o teclado tenta primeiro).
document.getElementById("fechar-dialogo").onclick = fecharConfiguracao;
document.getElementById("veu").onclick = fecharConfiguracao;
addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("dialogo").hidden) fecharConfiguracao(); });
// O LAYOUT ASSENTA DEPOIS DE DESENHAR, e é por isso que a altura do gráfico se mede mais de uma vez.
//
// Medido: uma única medição logo a seguir a desenhar pegava o topo ANTES de a fita e a faixa dos pares terem a
// altura final (o texto que muda — "há 25 s" → "há 2 min" — parte uma linha), e o gráfico ficava 34 px atrás da
// barra fixa, com a faixa do sinal tapada. Tentou-se um `ResizeObserver` sobre o `body`: não resolve, porque o
// observador não é notificado das mudanças que acontecem DENTRO do próprio callback, e a correcção morria ali.
// O que fecha o caso são três medições determinadas: um frame depois, e a 250 e a 900 ms.
let relogiosDoReencaixe = [];
function reencaixarEmBreve() {
  for (const t of relogiosDoReencaixe) clearTimeout(t);
  relogiosDoReencaixe = [
    setTimeout(ajustarAlturaDosPainéis, 0),
    setTimeout(ajustarAlturaDosPainéis, 250),
    setTimeout(ajustarAlturaDosPainéis, 900),
  ];
}

carregar();
setInterval(carregar, 60000); // o RELATÓRIO completo (com o gráfico): a série muda por BARRA

// O «AGORA», a cada 2 s — é isto que dá a sensação de vivo.
//
// O fio leve (`vivo.json`, ver `--sem-serie` no `retrato.ts`) NÃO traz as velas nem a série: traz o que se move a
// cada segundo no motor (a leitura com o preço e a idade do dado, a posição, a proposta, a última decisão, o
// risco, as faltas) e pesa 28 KB em vez de 2,7 MB. Este ciclo repinta os NÚMEROS e deixa o gráfico em paz — quem
// o redesenha é o relatório completo, no relógio dele (a série é do fecho da barra).
//
// O que o vivo não traz é PRESERVADO do retrato que já está desenhado: sem isto, o `desenharGrafico` seguinte
// encontraria um instrumento sem série e o gráfico apareceria vazio.
const INTERVALO_VIVO_MS = 2000;
const CAMPOS_DA_SERIE = ["velas", "serie_do_setup", "janela", "em_curso", "sobreposicao_indisponivel", "faltas_do_cruzamento"];
async function carregarVivo() {
  if (!dados || !Array.isArray(dados.mesas) || dados.mesas.length === 0) return; // o completo ainda não chegou
  let vivo;
  try {
    const r = await fetch(`vivo.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return; // sem vivo não se apaga nada: a tela fica com o que tem
    vivo = await r.json();
  } catch {
    return;
  }
  for (const [mi, mesa] of (vivo.mesas ?? []).entries()) {
    const minhaMesa = dados.mesas[mi];
    if (!minhaMesa) continue;
    const contas = minhaMesa.contas ?? [];
    for (const [ci, conta] of (mesa.contas ?? []).entries()) {
      const minhaConta = contas[ci];
      if (!minhaConta) continue;
      const velhos = minhaConta.instrumentos ?? [];
      const instrumentos = (conta.instrumentos ?? []).map((inst, ii) => {
        const velho = velhos[ii];
        if (!velho) return inst;
        const series = {};
        for (const k of CAMPOS_DA_SERIE) if (k in velho) series[k] = velho[k];
        return { ...inst, ...series };
      });
      Object.assign(minhaConta, conta, { instrumentos });
    }
    Object.assign(minhaMesa, mesa, { contas });
  }
  // O RETRATO DO VIVO NÃO SOBRESCREVE O DO COMPLETO: a fita mostra os dois, porque são duas coisas diferentes.
  // O `retrato` de cima é o do fio COMPLETO (é dele que veio o gráfico que está no ecrã); o `agora` é este. Trocar
  // um pelo outro faria a fita dizer «retrato há 2 s» com um gráfico de até um minuto atrás — uma meia-verdade.
  if (vivo.retrato) dados.agora = vivo.retrato;
  if (vivo.faltas) dados.faltas = vivo.faltas;
  if (vivo.configuracao) dados.configuracao = vivo.configuracao;
  // Os três desenhos do «agora» — e as mesmas duas guardas do `carregar`, porque o desenho reescreve o HTML e os
  // botões novos nasceriam mortos (é o mesmo motivo que está dito lá em cima).
  desenharFita();
  desenharPares();
  desenharODentro();
  aplicarOsEstadosDeRecolher();
  ligarOsBotoesDeRecolher();
  reencaixarEmBreve(); // a idade do dado muda de largura ("há 1 s" → "há 2 min") e o topo pode partir uma linha
}
setInterval(carregarVivo, INTERVALO_VIVO_MS);
</script>
