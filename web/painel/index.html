<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- A cor da barra do navegador também é paleta: sai do mesmo ficheiro de tokens, não de um hex solto. -->
<meta name="theme-color" content="#0f1a1f">
<title>MesaCore · painel</title>
<!-- UM SÓ SÍTIO DE VERDADE PARA A COR. O canvas não lê custom properties: quem desenha lê-as do documento
     (função `cor()`), e é por isso que o gráfico segue a paleta em vez de ter a sua. -->
<link rel="stylesheet" href="tema.css">
<style>
  /* Sem fonte de fora: zero pedido externo (o painel abre no telefone em rede fechada). */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--fundo);
    color: var(--tinta);
    font-family: var(--fonte-da-tela);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--fonte); font-variant-numeric: tabular-nums; }
  .fraco { color: var(--tinta-fraca); }
  .fantasma { color: var(--tinta-fantasma); }
  .mini { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: 13px; margin: 0; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  a { color: var(--compra-suave); }

  /* ---------- a estrutura: três colunas no computador, uma no telefone ---------- */
  .bancada {
    display: grid;
    grid-template-columns: 258px minmax(0, 1fr) 322px;
    gap: 10px;
    padding: 10px;
    align-items: start;
  }
  /* ---------- no telefone: o GRÁFICO primeiro ----------
     A ordem importa: no computador os três painéis cabem lado a lado, mas num ecrã de 844 px uma lista de pares
     antes do gráfico empurra-o para fora (medido: sobravam ~180 px de gráfico, o resto atrás da barra fixa).
     No telefone os pares passam a uma FAIXA horizontal — escolhe-se o par com o polegar e o gráfico fica à
     vista —, e as linhas de detalhe de cada cartão saem: quem as mostra é o painel «lado de dentro».
     O bloco do telefone está no FIM do ficheiro, e não aqui: com a mesma especificidade, quem ganha é a regra
     que vem DEPOIS — escrito aqui, era sobreposto pela regra base mais abaixo e não pegava (medido: a tabela da
     leitura continuava a transbordar com a regra "aplicada"). */
  .bloco {
    background: var(--painel-baixo);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    overflow: hidden;
  }
  .bloco > header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--painel-alto);
    border-bottom: 1px solid var(--borda);
    color: var(--tinta-fraca);
  }
  .bloco > header .contagem { margin-left: auto; color: var(--tinta-fraca); }
  .bloco .corpo { padding: 10px; }

  /* ---------- a vista de configuração ---------- *
   * Uma vista, não um diálogo: as fichas são documentos (com regras, veredicto e relatório) e um documento não
   * cabe numa caixa. Aqui tudo é LEITURA — o valor é TEXTO, como no diálogo da configuração, pela mesma razão:
   * um campo desactivado finge que se muda ali. */
  .vista-de-config { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  /* A VISTA É ESCOLHIDA NO `body`, E NÃO COM O ATRIBUTO `hidden` — e isto é uma armadilha concreta, não um gosto:
     o `hidden` esconde pelo estilo do browser (`display: none`), e qualquer regra de classe ganha-lhe
     (`.bancada { display: grid }`, `.barra-do-telefone { display: flex }` no telefone) — a barra do telefone
     voltava a aparecer POR CIMA da configuração. Com o atributo no `body` a regra é explícita e ganha. */
  body[data-vista="configuracao"] #bancada,
  body[data-vista="configuracao"] #bloco-registo,
  body[data-vista="configuracao"] #faltas,
  body[data-vista="configuracao"] .barra-do-telefone { display: none; }
  body[data-vista="configuracao"] .vista-de-config { display: flex; }
  .cabeca-da-vista { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cabeca-da-vista h1 { margin: 0; }
  .cabeca-da-vista .botao { margin-left: auto; }
  .vista-de-config .item-de-config { grid-template-columns: minmax(150px, 300px) 1fr; }
  .vista-de-config .valor { text-align: left; overflow-wrap: anywhere; }
  .relatorio-do-conferidor {
    margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: var(--fonte); font-size: 11.5px; line-height: 1.5;
    max-height: 320px; overflow: auto; padding: 8px 10px;
    background: var(--painel); border-radius: var(--raio-pequeno);
  }
  .caminho-da-ficha { color: var(--tinta-fraca); font-size: 11px; }

  /* ---------- compor e escrever uma ficha ---------- */
  /* O CAMPO É UM CAMPO: fundo do painel, contorno visível (o tom com alfa, que se vê sobre o painel — o tom cheio
     de `--borda` é o mesmo do fundo e não se vê), e um foco que se nota no teclado e no toque. */
  .vista-de-config input[type="text"], .vista-de-config select {
    width: 100%; min-height: 30px; padding: 3px 6px;
    background: var(--fundo); color: var(--tinta);
    border: 1px solid var(--tinta-fantasma); border-radius: var(--raio-pequeno);
    font: inherit;
  }
  .vista-de-config input[type="text"]:focus, .vista-de-config select:focus { outline: 2px solid var(--compra-suave); outline-offset: 1px; }
  .item-de-config.composto .nome-do-item { color: var(--tinta); }
  .botoes-da-ficha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .botao.escreve { background: var(--compra-suave); color: var(--tinta-no-acento); border-color: var(--compra); font-weight: 600; }
  .resultado { margin-top: 10px; padding: 8px 10px; border-radius: var(--raio-pequeno); border: 1px solid var(--borda); }
  .resultado.bom { border-color: var(--compra-suave); }
  .resultado.mau { border-color: var(--venda); }
  .resultado .item-de-config { border-bottom: 0; padding: 2px 0; }
  .relatorio { margin-top: 6px; }
  .relatorio summary { cursor: pointer; color: var(--tinta-fraca); }

  /* ---------- a fita: o que está vivo, sempre à vista ---------- */
  .fita {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 8px 12px;
    background: color-mix(in srgb, var(--fundo) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--borda);
  }
  .fita .marca { display: flex; align-items: baseline; gap: 8px; }
  .fita .marca b { color: var(--titulo); font-size: 14px; letter-spacing: .02em; }
  .selo {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--borda); background: var(--painel-alto);
    color: var(--tinta-fraca); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  }
  .selo.teste { color: var(--venda); border-color: color-mix(in srgb, var(--venda) 40%, transparent); }
  .selo.vivo { color: var(--compra-suave); border-color: color-mix(in srgb, var(--compra-suave) 40%, transparent); }
  .selo.parado { color: var(--neutro); }
  /* o ponto do estado: um glifo com casa própria, para a fila alinhar */
  .selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .selo.sem-ponto::before { display: none; }
  .numeros-da-fita { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-left: auto; align-items: center; }
  .numero { display: flex; flex-direction: column; line-height: 1.2; }
  .numero .rot { color: var(--tinta-fraca); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
  .numero .val { color: var(--tinta); font-size: 13px; }
  .botao {
    min-height: 32px; padding: 6px 12px;
    background: var(--painel-alto); color: var(--tinta);
    border: 1px solid var(--borda); border-radius: var(--raio-pequeno);
    font: inherit; cursor: pointer;
  }
  .botao:hover { border-color: var(--tinta-fraca); }
  @media (max-width: 1080px) { .botao { min-height: 44px; } }

  /* ---------- os pares ---------- */
  .par {
    display: block; width: 100%; text-align: left;
    padding: 9px 10px; background: transparent; color: inherit;
    border: 0; border-bottom: 1px solid var(--divisor);
    font: inherit; cursor: pointer;
  }
  .par:last-child { border-bottom: 0; }
  .par:hover { background: var(--painel); }
  .par[aria-selected=true] { background: var(--painel); box-shadow: inset 2px 0 0 var(--compra-suave); }
  .par .linha-de-cima { display: flex; align-items: center; gap: 8px; }
  .par .nome { color: var(--titulo); font-weight: 600; font-size: 14px; }
  .par .linha-de-cima .preco { margin-left: auto; }
  .par .grelha { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin-top: 4px; }
  .par .grelha .rot { color: var(--tinta-fraca); }
  .par .grelha .val { text-align: right; overflow-wrap: anywhere; }
  /* A LINHA PRINCIPAL — a que fica quando o cartão está recolhido. Os três pedaços separam-se por pontos, e não
     por uma grelha de rótulos: é a leitura de relance, não uma ficha. */
  .par .principal {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    margin-top: 5px;
  }
  .par .principal .mono { font-size: 11.5px; color: var(--tinta-fraca); }
  /* RECOLHIDO: o detalhe sai, e o cartão fica só com o principal. */
  .par.recolhido .grelha { display: none; }
  /* UM PAINEL RECOLHIDO GUARDA A BARRA DE TÍTULO, e mais nada.
     A regra é SÓ dos painéis (`.bloco`), e isto é uma correcção medida: escrita para todo o `[data-recolhivel]`,
     ela apanhava também o cartão de um par e a secção de dentro — o cartão ficava com 18 px (escondia-lhe o
     nome e o preço, porque nenhum desses filhos é `header`) e o `h3` da secção desaparecia, deixando a secção
     sem nada onde carregar. Cada forma tem a sua regra; o estado, esse, é um só. */
  .bloco[data-recolhivel].recolhido > :not(header):not(.cabecalho) { display: none; }
  /* Nas secções de dentro do painel, o cabeçalho é o `h3`. */
  .secao[data-recolhivel].recolhido > :not(h3) { display: none; }
  /* O BOTÃO DE ABRIR/RECOLHER — alvo pequeno mas com casa própria; no telefone cresce para 44 px. */
  .abre-o-card {
    margin-left: auto; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0;
    background: transparent; color: var(--tinta-fraca);
    border: 1px solid var(--borda); border-radius: var(--raio-pequeno);
    cursor: pointer;
  }
  .abre-o-card:hover { color: var(--tinta); border-color: var(--tinta-fraca); }
  /* NOS CABEÇALHOS O CONTORNO TINHA A COR DO FUNDO — `--borda` é o mesmo tom de `--painel-alto`, que é o fundo
     destas barras: o botão existia, lá estava, e não se lia como botão (foi uma captura que o apanhou, com a
     pergunta «há seta à direita?» a responder «quase invisível»). Medido sobre `--painel-alto` (#273035): o glifo
     em `--tinta-fraca` dá 5,22:1 — passa, mas lê-se como enfeite; em `--tinta` dá 13,15:1. Com o contorno em
     `--tinta-fantasma` (o tom com alfa, que se vê sobre o painel) o controle passa a ler-se como controle. */
  .bloco > header .abre-o-card,
  .leitura-do-setup > header .abre-o-card,
  .secao > h3 .abre-o-card { color: var(--tinta); border-color: var(--tinta-fantasma); }
  /* O chevron é um glifo com casa de 10×10, como os outros da fila: o avanço não muda com a rotação. */
  .glifo.chevron { width: 10px; height: 10px; background: currentColor; clip-path: polygon(50% 62%, 4% 20%, 4% 40%, 50% 82%, 96% 40%, 96% 20%); }
  .glifo.chevron.aberto { clip-path: polygon(50% 38%, 4% 80%, 4% 60%, 50% 18%, 96% 60%, 96% 80%); }
  /* O botão «abrir/recolher todos», na barra da secção. */
  .botao-mini {
    margin-left: 8px; padding: 1px 7px;
    background: transparent; color: var(--tinta-fraca);
    border: 1px solid var(--borda); border-radius: 999px;
    font: inherit; font-size: 10px; letter-spacing: .04em;
    cursor: pointer;
  }
  .botao-mini:hover { color: var(--tinta); border-color: var(--tinta-fraca); }
  .lado {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 7px; border-radius: 999px; font-size: 10.5px;
    letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
  }
  .lado.compra { background: var(--compra); color: var(--tinta-no-acento); }
  .lado.venda { background: var(--venda); color: var(--tinta-no-acento); }
  .lado.neutro { background: var(--painel-alto); color: var(--neutro); }
  /* cada glifo na mesma casa (10px): a fila alinha pelo avanço, não pela largura da forma */
  .glifo { display: inline-block; width: 10px; height: 10px; flex: none; }
  .glifo.tri-cima { clip-path: polygon(50% 0, 100% 100%, 0 100%); background: var(--compra); }
  .glifo.tri-baixo { clip-path: polygon(50% 100%, 100% 0, 0 0); background: var(--venda); }
  .glifo.barra { background: linear-gradient(var(--tinta-fraca), var(--tinta-fraca)); background-size: 100% 2px; background-position: 0 50%; background-repeat: no-repeat; }
  .legenda-do-grafico > span > .glifo { margin-right: 5px; }

  /* ---------- o gráfico ---------- */
  .grafico .cabecalho {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding: 8px 10px; border-bottom: 1px solid var(--divisor);
  }
  .grafico .cabecalho .titulo { color: var(--titulo); font-size: 15px; font-weight: 600; }
  .palco { height: min(58vh, 560px); min-height: 340px; }
  @media (max-width: 1080px) { .palco { height: 62vh; min-height: 320px; } }
  .legenda-do-grafico {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    padding: 7px 10px; border-top: 1px solid var(--divisor); color: var(--tinta-fraca);
  }
  .legenda-do-grafico > span { display: inline-flex; align-items: center; }
  .alternar { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--tinta-fraca); }
  .alternar input { accent-color: var(--compra-suave); width: 14px; height: 14px; }
  /* O CARD DA LEITURA tem cabeça própria e recolhe como os outros — e a cabeça serve para alguma coisa quando ele
     está recolhido: leva o resumo do que está lá dentro (quantas barras, que sinal, e se a medição que o setup
     deixou escrita concorda com a série que o motor calcula agora). Sem esse resumo, recolher seria esconder. */
  .leitura-do-setup { border-top: 1px solid var(--divisor); }
  .leitura-do-setup > header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--painel-alto); color: var(--tinta-fraca);
  }
  .leitura-do-setup > header .contagem { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* O título não parte: no telefone «A LEITURA DO SETUP» partia em duas linhas e a cabeça ia a 60 px por causa
     disso. Partido fica pior do que o resumo encolhido — e o resumo já tem o corte por reticências. */
  .leitura-do-setup > header .mini:first-child { white-space: nowrap; }
  #corpo-da-leitura { padding: 8px 10px; }
  .leitura-do-setup[data-recolhivel].recolhido > :not(header) { display: none; }
  /* Uma grelha de colunas FIXAS, com a linha inteira a não partir: é uma tabela de números, e uma tabela de
     números que quebra linha deixa de se poder ler de cima a baixo. O que não couber, rola na horizontal. */
  .tabela-de-barras { overflow-x: auto; margin-top: 5px; }
  .tabela-de-barras .linha {
    display: grid; grid-template-columns: 92px repeat(5, minmax(74px, 1fr));
    gap: 0 10px; white-space: nowrap; padding: 1px 0;
  }
  .tabela-de-barras .linha.cabeca { color: var(--tinta-fraca); border-bottom: 1px solid var(--divisor); position: sticky; top: 0; background: var(--painel-baixo); }
  .tabela-de-barras .linha > span:not(:first-child) { text-align: right; }
  .sig-compra { color: var(--compra-suave); }
  .sig-venda { color: var(--venda); }
  .dito { margin-top: 7px; padding: 6px 8px; border-left: 2px solid var(--borda); background: var(--painel); color: var(--tinta-fraca); }
  .aviso { padding: 8px 10px; border-left: 2px solid var(--venda); background: color-mix(in srgb, var(--venda) 8%, transparent); color: var(--tinta); }

  /* ---------- o lado de dentro ---------- */
  .dentro .corpo { padding: 0; }
  .secao { border-bottom: 1px solid var(--divisor); }
  .secao:last-child { border-bottom: 0; }
  .secao > h3 {
    margin: 0; padding: 7px 10px; font-size: 10.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-fraca);
    background: var(--painel);
    display: flex; align-items: center; gap: 8px;
  }
  .secao > h3 > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .secao > h3 .abre-o-card { margin-left: auto; width: 22px; height: 22px; }
  .secao > .dentro-da-secao { padding: 8px 10px; }
  dl.pares { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
  dl.pares dt { color: var(--tinta-fraca); }
  dl.pares dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .item-de-config { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 4px 0; border-bottom: 1px solid var(--divisor); }
  .item-de-config:last-child { border-bottom: 0; }
  .item-de-config .nome-do-item { color: var(--tinta-fraca); }
  .item-de-config .nome-do-item small { display: block; color: var(--tinta-fantasma); font-size: 10px; }
  .item-de-config .valor { text-align: right; }
  .item-de-config .valor b { color: var(--tinta); font-weight: 600; }
  .item-de-config .valor b.fraco { color: var(--tinta-fraca); font-weight: 400; }
  .item-de-config .valor .opcoes { display: block; color: var(--tinta-fantasma); font-size: 10px; }
  .comando { display: block; margin-top: 6px; padding: 6px 8px; background: var(--fundo); border: 1px solid var(--borda); border-radius: var(--raio-pequeno); color: var(--compra-suave); overflow-wrap: anywhere; }
  ul.lista { list-style: none; margin: 0; padding: 0; }
  ul.lista li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--divisor); }
  ul.lista li:last-child { border-bottom: 0; }
  ul.lista .quando { color: var(--tinta-fantasma); flex: none; }
  ul.lista .o-que { margin-left: auto; text-align: right; }

  /* ---------- o registo ---------- */
  .registo { margin: 0 10px 16px; }
  .registo .colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 18px; }
  .registo h4 { margin: 8px 0 4px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-fraca); }

  /* ---------- as faltas: ditas, nunca escondidas ---------- */
  .faltas { margin: 0 10px 24px; }
  .faltas .falta { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--divisor); }
  .faltas .falta b { color: var(--venda); font-weight: 600; }

  /* ---------- a barra fixa do telefone: o gesto que muda o estado, sem rolagem ---------- */
  .barra-do-telefone { display: none; }
  @media (max-width: 1080px) {
    .barra-do-telefone {
      display: flex; gap: 8px; align-items: center;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--painel-alto); border-top: 1px solid var(--borda);
    }
    .barra-do-telefone .quem { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .barra-do-telefone .botao { flex: none; }
  }

  /* ---------- o botão da configuração, ao lado do nome do símbolo ----------
     Um botão de verdade (`<button>`), e não um `<p>` com role: o teclado e o leitor de ecrã vêm de graça, e não
     custa nada. O glifo é um SVG inline em `currentColor` — não depende de fonte nenhuma e segue o tema. */
  .botao-config {
    display: inline-flex; align-items: center;
    padding: 4px 9px; margin-right: 2px;
    background: var(--painel-alto); color: var(--tinta-fraca);
    border: 1px solid var(--borda); border-radius: 999px;
    font: inherit; font-size: 11px; letter-spacing: .03em;
    cursor: pointer;
  }
  .botao-config:hover { color: var(--tinta); border-color: var(--tinta-fraca); }

  /* ---------- o diálogo: uma folha por cima, e nada por baixo a mexer ---------- */
  .veu { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #0b0d10 62%, transparent); }
  .dialogo {
    position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column;
    width: min(720px, calc(100vw - 24px)); max-height: min(82vh, 760px);
    background: var(--painel-baixo); border: 1px solid var(--borda); border-radius: var(--raio-grande);
    box-shadow: 0 20px 60px var(--sombra);
  }
  .veu[hidden], .dialogo[hidden] { display: none; }
  .cabeca-do-dialogo {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; background: var(--painel-alto);
    border-bottom: 1px solid var(--borda);
    border-radius: var(--raio-grande) var(--raio-grande) 0 0;
  }
  .cabeca-do-dialogo > span {
    color: var(--titulo); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cabeca-do-dialogo .botao { margin-left: auto; flex: none; }
  .corpo-do-dialogo { overflow: auto; padding: 12px; }
  .corpo-do-dialogo .secao:first-child > h3 { border-radius: 0; }

  /* ---------- O BLOCO DO TELEFONE, no fim de propósito ----------
     Tudo o que muda de forma num ecrã estreito vive AQUI, depois das regras base: com a mesma especificidade,
     quem ganha é a última — a mesma regra escrita mais acima era sobreposta sem dar erro nenhum, e o defeito
     aparecia só no aparelho. */
  @media (max-width: 1080px) {
    .bancada { grid-template-columns: 1fr; padding: 8px 8px 0; }
    #lista-de-pares { display: flex; overflow-x: auto; scroll-snap-type: x proximity; }
    .par { min-width: 208px; border-bottom: 0; border-right: 1px solid var(--divisor); scroll-snap-align: start; }
    /* No telefone o botão de abrir/recolher tem de ser tocável: 44 px, como os outros. */
    .abre-o-card { width: 44px; height: 44px; }
    .botao-mini { min-height: 32px; padding: 4px 10px; }
    /* MAS NO TELEFONE O CARTÃO DE UM PAR NÃO ABRE — e isto é medição, não gosto: com um cartão aberto a faixa dos
       pares ia a 224 px e empurrava o gráfico 21 px para trás da barra fixa. Aqui o detalhe vive no painel «lado
       de dentro» (logo abaixo do gráfico), a faixa fica baixinha (~68 px), e o botão do CARTÃO e o «abrir todos»
       SAEM: um controle que não muda nada visível é ruído.
       Atenção ao alcance disto: tem de ser `.par .abre-o-card`, e não `.abre-o-card` — escrito sem o `.par`,
       apagava TAMBÉM os botões dos painéis e das secções, e no telefone deixava de haver como recolher o
       gráfico (medido: com todos os botões escondidos, o gesto só existia pelo teclado). */
    .par .grelha { display: none; }
    .par .abre-o-card { display: none; }
    .botao-mini { display: none; }
    /* Os botões dos painéis e das secções, esses, ficam — e com alvo de 44 px. */
    .bloco > header .abre-o-card,
    .leitura-do-setup > header .abre-o-card,
    .secao > h3 .abre-o-card { width: 44px; height: 44px; }
    .secao > h3 { padding: 0 10px; }
    /* Na vista de configuração a chave fica por cima do valor: uma chave de 150 px num ecrã de 390 deixa 200 px
       ao valor, e há aqui valores longos (o caminho da credencial, o endereço da conta). */
    .vista-de-config .item-de-config { grid-template-columns: 1fr; }
    .vista-de-config .valor { text-align: left; }
    /* No telefone, campo e botão com alvo de dedo: um campo de 30 px de altura é um campo que se erra a escrever. */
    .vista-de-config input[type="text"], .vista-de-config select { min-height: 44px; }
    .botoes-da-ficha .botao { min-height: 44px; }
    /* A altura real do gráfico é calculada em JS (viewport − topo − barra); este valor é só o ponto de partida. */
    .palco { height: 46vh; min-height: 240px; }
    /* A tabela da leitura cabe inteira num ecrã de 390 px: 58 + 5×50 + 5×4 = 328 ≤ 352 (a largura útil medida). */
    .tabela-de-barras .linha { grid-template-columns: 58px repeat(5, minmax(50px, 1fr)); gap: 0 4px; font-size: 11.5px; }
    .registo, .faltas { margin-bottom: 0; }
    .faltas { padding-bottom: 100px; }   /* a barra fixa não tapa as faltas nem o registo */

    /* NO TELEFONE O DIÁLOGO É UMA FOLHA DE BAIXO: no centro do ecrã fica longe do polegar e o teclado tapa-o. */
    .dialogo {
      left: 0; right: 0; top: auto; bottom: 0; transform: none;
      width: 100%; max-height: 88vh;
      border-radius: var(--raio-grande) var(--raio-grande) 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .cabeca-do-dialogo { border-radius: var(--raio-grande) var(--raio-grande) 0 0; position: sticky; top: 0; z-index: 1; }
    /* ALVO DE 44 px, como o resto dos controles do telefone: eu tinha-o deixado em 32 px e a medição apanhou-o. */
    .botao-config { min-height: 44px; padding: 8px 12px; }
    .corpo-do-dialogo .item-de-config { grid-template-columns: 1fr; }
    .corpo-do-dialogo .item-de-config .valor { text-align: left; }
    .corpo-do-dialogo .item-de-config .valor .opcoes { text-align: left; }
  }
</style>
</head>
<body>

<header class="fita" id="fita"></header>

<main class="bancada" id="bancada">
  <aside class="bloco pares" data-recolhivel="bloco:pares">
    <header><span class="mini">Pares</span><span class="contagem mini" id="contagem-de-pares"></span>
      <button type="button" class="abre-o-card" data-alternar="bloco:pares" aria-expanded="true" aria-label="pares: recolher"><i class="glifo chevron aberto"></i></button></header>

<section class="bloco registo" id="bloco-registo" data-recolhivel="bloco:registo">

<!-- A VISTA DE CONFIGURAÇÃO — uma vista da própria tela, com endereço próprio (`#configuracao`), e NÃO um diálogo.
     Ver o porquê em `docs/INTERFACE-DE-CONTROLO.md` §11: o que muda um interruptor é diálogo; o que muda um
     DOCUMENTO (a ficha) é vista — porque o documento tem regras, um veredicto e um relatório, e isso não cabe
     numa caixa. O endereço próprio dá o que o diálogo não dá: o «voltar» do telefone funciona e um recarregamento
     não perde o sítio onde se estava. -->
<section class="vista-de-config" id="vista-de-config" hidden>
  <header class="cabeca-da-vista">
    <h1>Configuração</h1>

<section class="faltas" id="faltas"></section>

<div class="barra-do-telefone" id="barra-do-telefone"></div>

<!-- O DIÁLOGO DA CONFIGURAÇÃO — está no HTML estático, e não criado pelo JavaScript, para os `id` existirem
     sempre (uma referência morta só rebenta no gesto de quem abre). O conteúdo entra quando se abre. -->
<div class="veu" id="veu" hidden></div>
<div class="dialogo" id="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo" hidden>
  <header class="cabeca-do-dialogo">
    <span id="dialogo-titulo">configuração da ficha</span>
    <button class="botao" id="fechar-dialogo">fechar</button>
  </header>
  <div class="corpo-do-dialogo" id="dialogo-corpo"></div>
</div>

<script src="lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
const L = LightweightCharts;

/* ---------------------------------------------------------------------------
 * A COR VEM DO DOCUMENTO, NÃO DO JAVASCRIPT.
 *
 * Um canvas não lê custom properties: se o gráfico tivesse os seus hexes, o tema
 * passaria a ter duas paletas e uma delas não mudava. `cor()` resolve a variável
 * ATRAVÉS do motor de estilo (escreve-a num `color` e lê o resultado), e é assim
 * que os derivados por `color-mix(...)` também chegam ao gráfico.
 *
 * MAS O QUE O MOTOR DEVOLVE NÃO SERVE A TODA A GENTE — e isto foi medido, com o
 * preço de uma tela inteira em branco: para um `color-mix` o `getComputedStyle`
 * devolve a forma moderna `color(srgb 0.31 0.82 0.75 / 0.5)`, e a biblioteca do
 * gráfico (que valida cor com uma expressão regular de `rgb()/rgba()`) RECUSA-A —
 * `Failed to parse color: color(srgb …)`. A excepção rebentava dentro do desenho,
 * a meio, e o painel mostrava o rectângulo vazio com a legenda por baixo: o
 * sintoma era "sem dados", a causa era uma COR.
 *
 * (Tentou-se primeiro normalizar pelo próprio canvas — `fillStyle` — e NÃO serve:
 * esta versão do browser aceita a forma moderna e devolve-a tal e qual. Um regex
 * explícito é o que resta, e fica testável: a conversão é aritmética, não fé.)
 * ------------------------------------------------------------------------- */
const sonda = document.createElement("span");
sonda.style.display = "none";
document.body.appendChild(sonda);
/** `color(srgb r g b [/ a])` -> `rgb()/rgba()`. O resto (`rgb`, `rgba`, `#hex`) já vem na forma que a lib lê. */
function normalizarCor(bruto) {
  const m = /^color\(srgb\s+([0-9.]+)\s+([0-9.]+)\s+([0-9.]+)(?:\s*\/\s*([0-9.]+))?\s*\)$/.exec(String(bruto).trim());
  if (m === null) return bruto;
  const [r, g, b] = [m[1], m[2], m[3]].map((x) => Math.round(Number(x) * 255));
  return m[4] === undefined ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${Number(m[4])})`;
}
function cor(nome) {
  sonda.style.color = `var(${nome})`;
  return normalizarCor(getComputedStyle(sonda).color);
}

/**
 * OS ERROS DO PRÓPRIO GESTO, APANHADOS ONDE ELES ACONTECEM.
 *
 * Uma excepção dentro de um `listener` não sobe para quem chamou: fica na consola e o ecrã mostra só a metade
 * que correu. Foi assim que uma fatia inteira desta tela pareceu "sem dados" quando o problema era uma linha a
 * estourar a meio do desenho. Este ouvinte guarda os erros em `window.__erros` — e a barra do rodapé mostra-os
 * quando existem, em vez de a tela ficar calada sobre o que falhou.
 */
window.__erros = [];
addEventListener("error", (e) => window.__erros.push(`${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`));
addEventListener("unhandledrejection", (e) => window.__erros.push(`promessa recusada: ${e.reason && e.reason.message ? e.reason.message : String(e.reason)}`));

const escapar = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = (x) => (x === null || x === undefined || x === "" ? null : Number(x));
const dinheiro = (x, casas = 2) => (n(x) === null ? "—" : n(x).toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas }));
/** O preço vai como o venue o publicou (texto). Arredondar aqui era perder o algarismo que decide. */
const comoVeio = (x) => (x === null || x === undefined || x === "" ? "—" : String(x));
const hora = (ms) => (ms === null || ms === undefined ? "—" : new Date(Number(ms)).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
const diaEHora = (ms) => (ms === null || ms === undefined ? "—" : new Date(Number(ms)).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }));
const idade = (ms) => (ms === null || ms === undefined ? "—" : `${(Number(ms) / 1000).toFixed(1)} s`);
const desde = (ms) => {
  const s = Math.max(0, (Date.now() - Number(ms)) / 1000);
  if (s < 90) return `${s.toFixed(0)} s`;
  if (s < 5400) return `${(s / 60).toFixed(0)} min`;
  if (s < 172800) return `${(s / 3600).toFixed(1)} h`;
  return `${(s / 86400).toFixed(1)} dias`;
};
const ladoDoSig = (sig) => (sig === 1 ? "compra" : sig === -1 ? "venda" : "neutro");

let dados = null;
let selecionado = null;
let grafico = null;
const series = {};      // as séries do gráfico, por nome
let marcas = null;      // o gestor de marcadores (v5: createSeriesMarkers)

/* ============================ A FITA ==================================== */
function desenharFita() {
  const mesa = dados.mesas[0];
  const conta = mesa.contas[0];
  const ambiente = (conta.instrumentos.find((i) => i.leitura)?.ficha?.caminho || "").includes("teste") ? "TESTE" : null;
  const estado = mesa.estado_da_mesa;
  const classeDoEstado = estado === "em_operacao" ? "vivo" : estado === "parada" ? "parado" : "";
  const armados = conta.instrumentos.filter((i) => i.ficha?.enviar === true).length;
  const ligados = conta.instrumentos.filter((i) => i.ficha?.run === true).length;

  document.getElementById("fita").innerHTML = `
    <div class="marca">
      <b>MesaCore</b>
      <span class="fraco mono">${escapar(mesa.identidade ?? "—")}</span>
      ${ambiente ? `<span class="selo teste sem-ponto">ambiente ${ambiente}</span>` : ""}
      <span class="selo ${classeDoEstado}">${escapar(estado ?? "—")}</span>
    </div>
    <div class="numeros-da-fita">
      <div class="numero"><span class="rot">Equity</span><span class="val mono">${dinheiro(conta.equity)} USDC</span></div>
      <div class="numero"><span class="rot">Ciclos</span><span class="val mono">${mesa.registo.ciclos}</span></div>
      <div class="numero"><span class="rot">Ligação</span><span class="val mono">${escapar(mesa.ligacao ?? "—")}</span></div>
      <div class="numero"><span class="rot">Pares ligados / armados</span><span class="val mono">${ligados} / ${armados}</span></div>
      <div class="numero"><span class="rot">Retrato</span><span class="val mono">${hora(dados.retrato.gerado_em_ms)} <span class="fraco">(há ${desde(dados.retrato.gerado_em_ms)})</span></span></div>
      ${dados.agora ? `<div class="numero"><span class="rot">Agora</span><span class="val mono">${desde(dados.agora.gerado_em_ms)}</span></div>` : ""}
      <button class="botao" id="recarregar">Recarregar</button>
      <a class="botao" id="botao-config" href="#configuracao">Configuração</a>
    </div>`;
  document.getElementById("recarregar").onclick = carregar;
}

/* ============================ OS PARES ================================== *
 *
 * OS CARTÕES RECOLHEM (pedido do dono, 01/10/2026). Cada cartão tem DUAS camadas, e a linha entre elas é
 * desenhada de propósito:
 *
 *   * O PRINCIPAL, sempre à vista: o símbolo, o setup e o relógio, o preço, o LADO VIGENTE e os dois
 *     interruptores. É o que se lê de relance quando há muitos pares.
 *   * O DETALHE, só quando se abre: posição, última decisão e risco.
 *
 * Por omissão vêm RECOLHIDOS (é o que se pediu: só o principal exposto). A escolha de cada par fica gravada no
 * `localStorage` e sobrevive ao recarregamento — inclusive à renovação do retrato, que redesenha a lista a cada
 * minuto: por isso o estado vive numa variável, e não no DOM, que é reescrito.
 */
/* ================== O QUE RECOLHE, E POR QUÊ (um só estado) ============= *
 *
 * TUDO RECOLHE (pedido do dono, 01/10/2026), e o estado é UM SÓ — um conjunto de chaves no `localStorage`, com
 * o prefixo a dizer que espécie de coisa cada chave é (`par:BTC`, `bloco:grafico`, `secao:dentro:risco`). O que
 * "recolhido" esconde é que muda de forma para forma (o cartão de um par esconde o detalhe; um painel esconde o
 * corpo), e cada forma tem a sua regra declarada no CSS — mas quem guarda a escolha é o mesmo sítio.
 *
 * A OMISSÃO É GRAVADA, E NÃO DEDUZIDA — e isto é uma correcção medida, não um gosto. A primeira versão tratava
 * "não há chave gravada" como "está recolhido" e "há chave" como "está aberto": ao recolher UM par, a chave
 * passava a existir e TODOS OS OUTROS abriam — mexer num cartão mexia na lista inteira. Aqui o estado é
 * explícito desde o primeiro desenho: na primeira vez grava-se o conjunto com as omissões, e a partir daí o
 * conjunto É a verdade.
 *
 * AS OMISSÕES, e são uma decisão de desenho dita em voz alta:
 *   * os cartões dos pares começam RECOLHIDOS (só o principal exposto);
 *   * o GRÁFICO começa MAXIMIZADO, por pedido expresso — é o que se olha;
 *   * o card da LEITURA do setup (abaixo do gráfico) começa RECOLHIDO, e a cabeça dele leva o resumo — recolher
 *     não pode ser esconder;
 *   * os painéis e as secções começam abertos.
 */
const CHAVE_DO_RECOLHIDO = "mesacore.painel.recolhidos.v2";
const OMISSOES = { "bloco:grafico": false, "bloco:pares": false, "bloco:dentro": false, "bloco:registo": false, "bloco:leitura": true };
function lerRecolhidos() {
  try {
    const guardado = JSON.parse(localStorage.getItem(CHAVE_DO_RECOLHIDO) ?? "null");
    return { conjunto: new Set(Array.isArray(guardado) ? guardado : []), jaGravado: Array.isArray(guardado) };
  } catch {
    return { conjunto: new Set(), jaGravado: false };
  }
}
const doStorage = lerRecolhidos();
const recolhidos = doStorage.conjunto;
function gravarRecolhidos() {
  try { localStorage.setItem(CHAVE_DO_RECOLHIDO, JSON.stringify([...recolhidos])); } catch { /* sem storage, segue sem gravar */ }
}
let omissaoJaAplicada = doStorage.jaGravado;
function aplicarAsOmissoes(instrumentos) {
  if (omissaoJaAplicada) return;
  for (const [chave, fechado] of Object.entries(OMISSOES)) if (fechado) recolhidos.add(chave);
  for (const i of instrumentos) recolhidos.add(`par:${i.instrumento}`); // os cartões nascem recolhidos
  gravarRecolhidos();
  omissaoJaAplicada = true;
}
const estaRecolhido = (chave) => recolhidos.has(chave);
/** O gesto: uma chave, e o estado dela. Uma só função para todos os botões da tela. */
function alternarRecolhido(chave) {
  const eraGrafico = chave === "bloco:grafico";
  if (recolhidos.has(chave)) recolhidos.delete(chave); else recolhidos.add(chave);
  gravarRecolhidos();
  aplicarOsEstadosDeRecolher();
  if (eraGrafico && !estaRecolhido(chave)) repintarOGrafico();
  reencaixarEmBreve(); // a altura do que está por cima do gráfico pode ter mudado: mede-se de novo
}

/**
 * O GRÁFICO NÃO SE REPINTA SOZINHO DEPOIS DE VOLTAR DE `display: none` — e isto é medido, não suposto.
 *
 * Enquanto recolhido, o contentor tem altura 0; a biblioteca fica com um tamanho inválido em memória e o canvas
 * volta com o bitmap de omissão (300×150) e **sem um pixel desenhado** — o gráfico aparece vazio depois de
 * reabrir, que é o pior defeito possível nesta tela (parece "sem dados"). Reaplicar o tamanho não bastou.
 *
 * O que repinta de forma determinística é RECONSTRUIR: a mesma função que montou o gráfico na primeira vez
 * (a criação é o caminho já provado). Custa reescrever 505 barras de série, que é instantâneo, e evita a
 * ginástica de forçar um tamanho falso só para acordar o desenho.
 */
function repintarOGrafico() {
  if (!grafico) return;
  requestAnimationFrame(() => {
    try { grafico.remove(); } catch { /* já não havia nada para remover */ }
    grafico = null;
    for (const k of Object.keys(series)) delete series[k];
    marcas = null;
    desenharGrafico();
    // O desenho reescreveu a cabeça e a matéria da leitura: os botões novos nasceriam mortos.
    aplicarOsEstadosDeRecolher();
    ligarOsBotoesDeRecolher();
  });
}
/** Põe o estado guardado em cada contentor que se recolhe (a classe é o que o CSS lê). */
function aplicarOsEstadosDeRecolher() {
  for (const el of document.querySelectorAll("[data-recolhivel]")) {
    el.classList.toggle("recolhido", estaRecolhido(el.dataset.recolhivel));
    for (const b of el.querySelectorAll("[data-alternar='" + el.dataset.recolhivel + "']")) {
      b.setAttribute("aria-expanded", String(!estaRecolhido(el.dataset.recolhivel)));
      b.title = estaRecolhido(el.dataset.recolhivel) ? "abrir" : "recolher (deixar só o principal)";
      const g = b.querySelector(".glifo.chevron");
      if (g) g.classList.toggle("aberto", !estaRecolhido(el.dataset.recolhivel));
    }
  }
}
/**
 * O BOTÃO DE RECOLHER, um só construtor para todos os sítios.
 * O `stopPropagation` é essencial no cartão de um par (que é clicável por inteiro): sem ele, recolher o cartão
 * escolhia o par. Nos painéis não faz mal nenhum, e a regra é a mesma em todo o lado — uma regra, um dono.
 */
function botaoDeRecolher(chave, rotulo) {
  const fechado = estaRecolhido(chave);
  return `<button type="button" class="abre-o-card" data-alternar="${escapar(chave)}" aria-expanded="${!fechado}"
    title="${fechado ? "abrir" : "recolher"}" aria-label="${escapar(rotulo)}: ${fechado ? "abrir" : "recolher"}">
    <i class="glifo chevron ${fechado ? "" : "aberto"}"></i>
  </button>`;
}
/**
 * QUANDO A ABA VOLTA (o dono troca de app no telefone e volta ao painel), O GRÁFICO PODE VOLTAR VAZIO.
 *
 * Com a aba escondida o `requestAnimationFrame` não corre — medido: **0 frames em 1,2 s** e o canvas parado no
 * bitmap de omissão (300×150), sem um pixel desenhado. Um desenho que tivesse ficado à espera nunca chega a
 * acontecer, e o gráfico aparece vazio, que é o pior defeito possível nesta tela: parece «sem dados» quando os
 * dados estão lá. Aqui a volta da aba é tratada como o que ela é — um pedido de desenho — e só se reconstrói
 * quando é mesmo preciso (o canvas ainda no tamanho de omissão), para não desmontar o gráfico de quem só
 * voltou a olhar.
 *
 * O 300×150 é o tamanho de omissão do `<canvas>` do HTML: nesta tela o palco nunca é assim tão pequeno (o
 * mínimo medido é 240×220), por isso vê-lo é sinal seguro de que o gráfico nunca chegou a desenhar.
 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const c = document.querySelector("#palco canvas");
  if (!c || (c.width === 300 && c.height === 150)) repintarOGrafico();
  reencaixarEmBreve();
});

function ligarOsBotoesDeRecolher() {
  for (const b of document.querySelectorAll("[data-alternar]")) {
    b.onclick = (e) => { e.stopPropagation(); alternarRecolhido(b.dataset.alternar); };
  }
}

function desenharPares() {
  const conta = dados.mesas[0].contas[0];
  aplicarAsOmissoes(conta.instrumentos); // na primeira volta, os cartões nascem recolhidos — e isso fica gravado
  const caixa = document.getElementById("lista-de-pares");
  document.getElementById("contagem-de-pares").innerHTML =
    `${conta.instrumentos.length} em negociação <button class="botao-mini" id="alternar-todos">${
      conta.instrumentos.every((i) => estaRecolhido(`par:${i.instrumento}`)) ? "abrir todos" : "recolher todos"
    }</button>`;

  caixa.innerHTML = conta.instrumentos.map((i) => {
    const l = i.leitura ?? {};
    const pos = l.posicao;
    const ultimoPonto = i.serie_do_setup[i.serie_do_setup.length - 1] ?? null;
    // O LADO VIGENTE VEM DA SÉRIE — que é a conta do PRÓPRIO setup sobre a barra que decidiu —, e não de um
    // número arrancado de um log que pode ser de uma volta antiga.
    const sig = ultimoPonto?.sig ?? null;
    const virou = ultimoPonto?.virada ? ultimoPonto.virada : 0;
    const decidiu = i.ultima_decisao;
    const recolhido = estaRecolhido(`par:${i.instrumento}`);
    return `
    <div class="par ${recolhido ? "recolhido" : ""}" data-recolhivel="par:${escapar(i.instrumento)}" role="option" data-par="${escapar(i.instrumento)}" aria-selected="${i.instrumento === selecionado}" tabindex="0">
      <span class="linha-de-cima">
        <span class="nome">${escapar(i.instrumento)}</span>
        <span class="fraco mono" style="font-size:11px">${escapar(i.ficha?.setup ?? "?")} ${escapar(i.ficha?.relogio ?? "")}</span>
        ${virou !== 0 ? `<span class="glifo ${virou === 1 ? "tri-cima" : "tri-baixo"}" title="virou nesta barra"></span>` : ""}
        <span class="preco mono">${comoVeio(l.ultimo ?? l.bid)}</span>
        ${botaoDeRecolher(`par:${i.instrumento}`, `o cartão de ${i.instrumento}`)}
      </span>

      <!-- O PRINCIPAL: fica sempre. -->
      <span class="principal">
        <span class="lado ${ladoDoSig(sig)}">${sig === 1 ? "comprado" : sig === -1 ? "vendido" : "sem lado"}</span>
        <span class="mono ${i.ficha?.run ? "" : "fraco"}">rodar: ${i.ficha?.run ? "sim" : "não"}</span>
        <span class="mono ${i.ficha?.enviar ? "" : "fraco"}">enviar: ${i.ficha?.enviar ? "sim" : "não"}</span>
      </span>

      <!-- O DETALHE: só com o cartão aberto. -->
      <span class="grelha">
        <span class="rot">posição</span><span class="val mono">${pos ? `${escapar(pos.lado)} ${comoVeio(pos.unidades)} @ ${comoVeio(pos.preco_medio)}` : "nenhuma"}</span>
        <span class="rot">última decisão</span><span class="val mono fraco">${decidiu ? `${escapar(decidiu.acao)} · ${escapar(decidiu.motivo)}` : "—"}</span>
        <span class="rot">risco</span><span class="val mono fraco">${escapar(i.risco?.saldo_pct ?? "?")}% × ${escapar(i.risco?.alavancagem ?? "?")}</span>
        ${i.falhas && (i.falhas.leitura === false && i.falhas.setup_respondeu === true) ? "" : `<span class="rot">falhas</span><span class="val mono fraco">${escapar(JSON.stringify(i.falhas ?? {}))}</span>`}
      </span>
    </div>`;
  }).join("");

  for (const b of caixa.querySelectorAll(".par")) {
    const escolher = () => { selecionado = b.dataset.par; desenharPares(); desenharGrafico(); desenharODentro(); desenharRegistoEFaltas(); desenharBarraDoTelefone(); };
    b.onclick = escolher;
    // O TECLADO SÓ ESCOLHE QUANDO O FOCO ESTÁ NO CARTÃO. Sem este teste, o `Enter` no botão de abrir subia ao
    // cartão e escolhia o par — dois efeitos num gesto.
    b.onkeydown = (e) => { if (e.target === b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); escolher(); } };
  }
  // O GESTO DE ABRIR/RECOLHER não pode chegar ao cartão (senão escolhia o par ao mesmo tempo): a ligação é
  // partilhada com todos os outros botões da tela (`ligarOsBotoesDeRecolher`), e ela já faz `stopPropagation`.
  ligarOsBotoesDeRecolher();
  document.getElementById("alternar-todos").onclick = (e) => {
    e.stopPropagation();
    const todos = conta.instrumentos.map((i) => `par:${i.instrumento}`);
    const todosRecolhidos = todos.every((c) => estaRecolhido(c));
    for (const c of todos) { if (todosRecolhidos) recolhidos.delete(c); else recolhidos.add(c); }
    gravarRecolhidos();
    aplicarOsEstadosDeRecolher();
    reencaixarEmBreve();
  };
}

/* ============================ O GRÁFICO ================================= */
const instrumentoAtual = () => dados.mesas[0].contas[0].instrumentos.find((i) => i.instrumento === selecionado) ?? dados.mesas[0].contas[0].instrumentos[0];

/**
 * O TAMANHO DO GRÁFICO É MEDIDO, NÃO DELEGADO.
 *
 * A primeira versão usava `autoSize: true` — a biblioteca mede o contentor por `ResizeObserver`. Medido no
 * browser: os canvas ficavam com o tamanho de CSS certo e o BITMAP no valor de omissão (300×150), ou seja, o
 * gráfico nunca pintava, e a página mostrava um rectângulo vazio com a legenda por baixo. Não é um defeito de
 * dados (as 505 velas estavam lá): é o tamanho a chegar depois da primeira pintura.
 *
 * Aqui o tamanho é lido do contentor no momento de criar e reaplicado em cada `resize` — sem depender de um
 * observador que pode não correr antes da primeira pintura.
 */
function medirPalco() {
  const p = document.getElementById("palco");
  return { width: Math.max(240, Math.floor(p.clientWidth)), height: Math.max(220, Math.floor(p.clientHeight)) };
}

function montarGrafico() {
  const palco = document.getElementById("palco");
  const medida = medirPalco();
  const g = L.createChart(palco, {
    width: medida.width,
    height: medida.height,
    layout: {
      background: { type: "solid", color: cor("--fundo") },
      textColor: cor("--tinta-fraca"),
      fontFamily: getComputedStyle(document.body).fontFamily,
      fontSize: 11,
      attributionLogo: false,
    },
    grid: { vertLines: { color: cor("--grelha") }, horzLines: { color: cor("--grelha") } },
    rightPriceScale: { borderColor: cor("--borda") },
    timeScale: { borderColor: cor("--borda"), timeVisible: true, secondsVisible: false, rightOffset: 6 },
    crosshair: {
      mode: L.CrosshairMode.Normal,
      vertLine: { color: cor("--tinta-fraca"), labelBackgroundColor: cor("--painel-alto"), width: 1, style: L.LineStyle.Dotted },
      horzLine: { color: cor("--tinta-fraca"), labelBackgroundColor: cor("--painel-alto"), width: 1, style: L.LineStyle.Dotted },
    },
    localization: {
      locale: "pt-BR",
      // O eixo do tempo mostra a HORA LOCAL de quem olha — e a legenda diz o fuso, para não haver dúvida sobre
      // qual barra é qual.
      timeFormatter: (t) => new Date(t * 1000).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }),
    },
  });

  // As velas com o tom SUAVE, não com o acento vivo: um corpo de vela é uma área grande, e a tinta clara
  // usada como preenchimento vira a parede mais acesa do ecrã (medido: tinta sobre o acento = 1,81:1).
  series.vela = g.addSeries(L.CandlestickSeries, {
    upColor: cor("--compra-suave"), downColor: cor("--venda"),
    wickUpColor: cor("--compra-suave"), wickDownColor: cor("--venda"),
    borderVisible: false, priceLineVisible: false, lastValueVisible: true,
  }, 0);

  series.media = g.addSeries(L.LineSeries, {
    color: cor("--media"), lineWidth: 2, priceLineVisible: false, lastValueVisible: false,
    title: "média",
  }, 0);
  series.bandaAlta = g.addSeries(L.LineSeries, {
    color: cor("--banda"), lineWidth: 1, lineStyle: L.LineStyle.Dashed, priceLineVisible: false, lastValueVisible: false,
  }, 0);
  series.bandaBaixa = g.addSeries(L.LineSeries, {
    color: cor("--banda"), lineWidth: 1, lineStyle: L.LineStyle.Dashed, priceLineVisible: false, lastValueVisible: false,
  }, 0);
  series.extremo = g.addSeries(L.LineSeries, {
    color: cor("--extremo"), lineWidth: 1, lineStyle: L.LineStyle.SparseDotted, lineType: L.LineType.WithSteps,
    priceLineVisible: false, lastValueVisible: false, visible: false,
  }, 0);

  // A FAIXA DO SINAL — um painel próprio por baixo. É aqui que se lê o LADO vigente barra a barra, sem sujar o
  // preço; é o mesmo número que o motor usou para decidir (`sig`), não uma leitura nova.
  series.sinal = g.addSeries(L.HistogramSeries, {
    priceFormat: { type: "price", precision: 0, minMove: 1 },
    priceLineVisible: false, lastValueVisible: false, base: 0,
    title: "lado",
  }, 1);
  marcas = L.createSeriesMarkers(series.vela, []);
  return g;
}

function ajustarAlturaDosPainéis() {
  if (!grafico) return;
  // COM O PAINEL RECOLHIDO NÃO HÁ O QUE MEDIR: o contentor está escondido, a altura é 0, e sem este guarda o
  // gráfico era redimensionado para o mínimo e desenhava uma miniatura de 172×137 que ninguém vê (medido). Ao
  // reabrir, quem trata do desenho é o `repintarOGrafico`.
  const painel = document.querySelector('[data-recolhivel="bloco:grafico"]');
  if (painel !== null && painel.classList.contains("recolhido")) return;
  const palco = document.getElementById("palco");
  const barra = document.getElementById("barra-do-telefone");
  const estreito = window.innerWidth <= 1080;
  const barraVisivel = barra !== null && getComputedStyle(barra).display !== "none";

  // NO TELEFONE A ALTURA É MEDIDA, NÃO ESTIMADA EM `vh`. Uma altura em `vh` ignora o que está por cima (a fita,
  // a faixa dos pares) e o que está por baixo (a barra fixa): medido, o gráfico começava em y=415 e terminava
  // atrás da barra — a faixa do sinal e o eixo do tempo ficavam tapados, que é precisamente onde se lê o lado
  // vigente. Aqui calcula-se o que sobra do ecrã: viewport − topo do palco − altura da barra.
  if (estreito && barraVisivel) {
    const topo = palco.getBoundingClientRect().top + window.scrollY;
    // A ALTURA DO ECRÃ É A MENOR DAS TRÊS que o browser publica. Medido: com emulação de aparelho o
    // `window.innerHeight` (888) não é o que se vê (844), e usar o maior deixava 34 px do gráfico atrás da barra
    // — precisamente a faixa do sinal. O menor dos três é o que nunca mente.
    const alturaDoEcra = Math.min(
      window.visualViewport ? window.visualViewport.height : Infinity,
      document.documentElement.clientHeight,
      window.innerHeight,
    );
    const alvo = Math.max(240, Math.round(alturaDoEcra - topo - barra.getBoundingClientRect().height - 10));
    // Só escreve se mudou: este cálculo volta a correr a cada mudança de layout (ver o observador), e escrever
    // sempre punha um ciclo observador→escrita→observador sem fim.
    if (Math.abs(palco.clientHeight - alvo) > 1) palco.style.height = `${alvo}px`;
  } else if (palco.style.height !== "") {
    palco.style.height = ""; // no computador vale a altura do CSS (min(58vh, 560px))
  }

  const medida = medirPalco();
  grafico.applyOptions(medida);
  const painéis = grafico.panes();
  if (painéis.length < 2) return;
  painéis[1].setHeight(Math.max(54, Math.round(medida.height * 0.18)));
}

/**
 * QUANTOS PIXELS O GRÁFICO PINTA — a prova de que desenhou, sem depender do olho.
 *
 * Duas armadilhas medidas nesta fatia, e as duas davam FALSO DEFEITO:
 *   (a) medir em sincronia, logo a seguir ao `setData`, diz sempre "não pintou" — o desenho acontece no
 *       `requestAnimationFrame` seguinte. Por isso isto corre depois de um frame (e mais um `setTimeout`);
 *   (b) o PRIMEIRO canvas do contentor não é o que desenha: a biblioteca empilha vários (desenho e sobreposições)
 *       e os de sobreposição ficam com o tamanho de omissão (300×150) de propósito. O que vale é o MAIOR.
 *
 * O fundo conta-se por ALFA: um canvas ainda por pintar é transparente (0,0,0,0) e seria contado como "desenhado"
 * se a conta fosse só por cor. Pixel desenhado = alfa > 0 e cor diferente do fundo do tema (#0f1a1f).
 */
function medirOPintado() {
  requestAnimationFrame(() => setTimeout(() => {
    try {
      const cs = Array.from(document.querySelectorAll("#palco canvas"));
      const maior = cs.reduce((a, b) => ((b.width * b.height) > (a ? a.width * a.height : 0) ? b : a), null);
      if (!maior || maior.width === 0) { if (window.__diag) window.__diag.pintado = { erro: "sem canvas com bitmap" }; return; }
      const px = maior.getContext("2d").getImageData(0, 0, maior.width, maior.height).data;
      let comAlfa = 0, foraDoFundo = 0;
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 3] === 0) continue;
        comAlfa++;
        if (Math.abs(px[i] - 15) > 6 || Math.abs(px[i + 1] - 26) > 6 || Math.abs(px[i + 2] - 31) > 6) foraDoFundo++;
      }
      if (window.__diag) {
        window.__diag.pintado = {
          canvas_de_desenho: `${maior.width}x${maior.height}`,
          canvas_no_palco: cs.length,
          pixels_opacos: comAlfa,
          pixels_fora_do_fundo: foraDoFundo,
          total: maior.width * maior.height,
        };
      }
    } catch (e) {
      if (window.__diag) window.__diag.pintado = { erro: String(e) };
    }
  }, 400));
}

function desenharGrafico() {
  const i = instrumentoAtual();
  const cabecalho = document.getElementById("cabecalho-do-grafico");
  const temSerie = (i.serie_do_setup ?? []).length > 0;
  const últimaFechada = i.janela?.ate ?? null;
  const dito = i.o_que_o_setup_disse ?? {};
  const ultimoPonto = i.serie_do_setup[i.serie_do_setup.length - 1] ?? null;
  const sig = ultimoPonto?.sig ?? null;
  const virou = ultimoPonto?.virada ? ultimoPonto.virada : 0;

  cabecalho.innerHTML = `
  <button type="button" class="botao-config" id="bt-config" title="a configuração desta ficha">
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true" style="vertical-align:-1px;margin-right:5px">
      <path d="M1 3.5h12M1 7h12M1 10.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="5" cy="3.5" r="1.9" fill="var(--painel-alto)" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="9.5" cy="7" r="1.9" fill="var(--painel-alto)" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="4" cy="10.5" r="1.9" fill="var(--painel-alto)" stroke="currentColor" stroke-width="1.4"/>
    </svg>configuração</button>
    <span class="titulo">${escapar(i.instrumento)}</span>
    <span class="fraco mono">${escapar(i.ficha?.setup ?? "?")} ${escapar(i.ficha?.versao_do_setup ?? "")} · relógio ${escapar(i.ficha?.relogio ?? "?")}</span>
    ${sig !== null ? `<span class="lado ${ladoDoSig(sig)}">${sig === 1 ? "comprado" : sig === -1 ? "vendido" : "sem lado"}</span>` : ""}
    ${virou !== 0 ? `<span class="fraco"><span class="glifo ${virou === 1 ? "tri-cima" : "tri-baixo"}" style="vertical-align:-1px"></span> virou em ${hora(últimaFechada)}</span>` : ""}
    <span class="fraco mono" style="margin-left:auto">
      última barra (a que decidiu): ${diaEHora(últimaFechada)} · hora local ${new Date().toLocaleTimeString("pt-BR", { timeZoneName: "short" }).split(" ").pop()}
    </span>
    ${botaoDeRecolher("bloco:grafico", "o gráfico")}`;

  // O botão da configuração é re-desenhado a cada volta (o cabeçalho é reescrito), e por isso a ligação é
  // refeita aqui: um botão sem gesto é pior do que nenhum botão.
  document.getElementById("bt-config").onclick = abrirConfiguracao;
  // Se o diálogo estiver aberto quando os dados chegam (o retrato renova a cada minuto), o conteúdo dele é
  // refrescado — senão mostrava valores de há dois minutos ao lado de um gráfico já novo.
  if (!document.getElementById("dialogo").hidden) {
    document.getElementById("dialogo-titulo").textContent = `configuração · ${i.instrumento} · ${i.ficha?.setup ?? "?"} ${i.ficha?.versao_do_setup ?? ""}`;
    document.getElementById("dialogo-corpo").innerHTML = conteudoDaConfiguracao(i);
  }

  if (!grafico) { grafico = montarGrafico(); }
  ajustarAlturaDosPainéis();

  // --- as velas: o que o venue publicou ---
  series.vela.setData((i.velas ?? []).map((v) => ({
    time: Math.floor(v.t / 1000), open: Number(v.o), high: Number(v.h), low: Number(v.l), close: Number(v.c),
  })));

  // --- a série do setup: o que o indicador viu, barra a barra ---
  const s = i.serie_do_setup ?? [];
  series.media.setData(s.filter((x) => x.ma !== null).map((x) => ({ time: Math.floor(x.t / 1000), value: x.ma })));
  series.bandaAlta.setData(s.map((x) => ({ time: Math.floor(x.t / 1000), value: (x.ma ?? 0) + (x.banda ?? 0) })));
  series.bandaBaixa.setData(s.map((x) => ({ time: Math.floor(x.t / 1000), value: (x.ma ?? 0) - (x.banda ?? 0) })));
  series.extremo.setData(s.filter((x) => x.extremo !== null).map((x) => ({ time: Math.floor(x.t / 1000), value: x.extremo })));
  series.sinal.setData(s.map((x) => ({
    time: Math.floor(x.t / 1000), value: x.sig,
    color: x.sig === 1 ? cor("--compra-suave") : x.sig === -1 ? cor("--venda") : cor("--neutro"),
  })));

  // --- as marcas: a vIRADA da regra (seta) e a DECISÃO da mesa (círculo) ---
  // A biblioteca só desenha circle/square/arrowUp/arrowDown — o triângulo do Pine virou SETA, e a direção dela
  // é a do LADO (comprado/vendido), não a do preço. Está dito na legenda para ninguém ler a seta como
  // "subiu/desceu". As nossas decisões de abrir vão no tempo da barra, como círculo, e são outra marca: uma é a
  // regra a virar, a outra é a mesa a decidir.
  const lista = s.filter((x) => x.virada !== 0).map((x) => ({
    time: Math.floor(x.t / 1000),
    position: x.virada === 1 ? "belowBar" : "aboveBar",
    shape: x.virada === 1 ? "arrowUp" : "arrowDown",
    color: x.virada === 1 ? cor("--compra") : cor("--venda"),
    text: "",
  }));
  const tempoDasBarras = new Set(s.map((x) => x.t));
  for (const ms of i.decisoes_de_abrir_ms ?? []) {
    // A decisão cai numa barra: procura-se a barra que a contém (o instante cai DENTRO da barra, não na abertura
    // dela — foi um erro medido numa bancada deste repositório).
    const barra = s.find((x) => x.t <= ms && ms < x.t + 3600000);
    if (barra === undefined) continue;
    lista.push({
      time: Math.floor(barra.t / 1000), position: "aboveBar", shape: "circle",
      color: cor("--tinta"), text: "decisão",
    });
  }
  marcas.setMarkers(lista.sort((a, b) => a.time - b.time));

  // --- instrumentação mínima, para a verificação não depender do olho ---
  // `window.__diag` diz o que o gráfico REALMENTE tem (tamanho em bitmap, barras em cada série, painéis): é por
  // aqui que se prova que pintou, em vez de se julgar uma captura de ecrã. Não decide nada nem mostra nada.
  try {
    window.__diag = {
      palco: medirPalco(),
      painéis: grafico.panes().length,
      velas: (i.velas ?? []).length,
      barras_da_serie: s.length,
      marcadores: lista.length,
      sig_da_ultima_barra: s.length ? s[s.length - 1].sig : null,
      faltas_do_cruzamento: i.faltas_do_cruzamento ?? null,
      /** Preenchido a seguir à PRIMEIRA PINTURA (ver `medirOPintado`), e não agora: medir neste instante dava
       *  sempre "não pintou" — o desenho acontece no `requestAnimationFrame` que ainda não correu. */
      pintado: null,
    };
  } catch (e) {
    window.__diag = { erro: String(e) };
  }
  medirOPintado();

  // --- a legenda e os interruptores do desenho ---
  document.getElementById("legenda").innerHTML = `
    <span><i class="glifo barra" style="background:${cor("--media")}"></i>média do indicador</span>
    <span><i class="glifo barra" style="background:${cor("--banda")}"></i>zona morta (± banda × ATR) — dentro dela a virada não acontece</span>
    <span><i class="glifo barra" style="background:${cor("--extremo")}"></i>extremo da perna (a memória do zigzag)</span>
    <span><span class="glifo tri-cima"></span>virou para comprado &nbsp;<span class="glifo tri-baixo"></span>virou para vendido (a seta segue o LADO, não o preço)</span>
    <span class="alternar"><input type="checkbox" id="c-media" checked>média</span>
    <span class="alternar"><input type="checkbox" id="c-banda" checked>zona morta</span>
    <span class="alternar"><input type="checkbox" id="c-extremo">extremo</span>
    <span class="alternar"><input type="checkbox" id="c-sinal" checked>faixa do sinal</span>`;
  document.getElementById("c-media").onchange = (e) => { series.media.applyOptions({ visible: e.target.checked }); };
  document.getElementById("c-banda").onchange = (e) => { series.bandaAlta.applyOptions({ visible: e.target.checked }); series.bandaBaixa.applyOptions({ visible: e.target.checked }); };
  document.getElementById("c-extremo").onchange = (e) => { series.extremo.applyOptions({ visible: e.target.checked }); };
  document.getElementById("c-sinal").onchange = (e) => { series.sinal.applyOptions({ visible: e.target.checked }); };

  // --- a leitura do setup: as últimas barras, palavra por palavra dele ---
  // O CARD TEM CABEÇA PRÓPRIA: o título e o resumo vivem no `header` (que fica quando ele está recolhido), e a
  // matéria vive no corpo. A cabeça é o que faz recolher valer a pena — sem resumo, recolher seria esconder.
  const caixa = document.getElementById("corpo-da-leitura");
  if (!temSerie) {
    document.getElementById("resumo-da-leitura").textContent = "este setup não publica série";
    caixa.innerHTML = `<div class="aviso"><b>Este setup não publica série.</b> ${escapar(i.sobreposicao_indisponivel ?? "sem motivo declarado")}<br>
      <span class="fraco">O gráfico mostra o mercado. A leitura do indicador não se inventa aqui — quem a sabe é o setup.</span></div>`;
    return;
  }
  // AS DUAS PONTAS, À VISTA E CRUZADAS: a SÉRIE (o setup a recalcular sobre a barra que decidiu, agora) e a
  // MEDIÇÃO que ele deixou escrita no log (datada com a volta). Se discordarem, vê-se que discordam — em vez de
  // uma delas tapar a outra.
  const med = dito.medicao;
  const concordam = med === null || med === undefined || sig === null ? null : med.sig === sig;
  const últimas = s.slice(-5);
  // O resumo da cabeça: o que se quer saber sem abrir o card. As duas pontas do cruzamento (a série que o motor
  // calcula agora e a medição que ele deixou escrita) aparecem aqui juntas — se discordarem, vê-se sem abrir.
  document.getElementById("resumo-da-leitura").textContent =
    `${últimas.length} barras · sig ${sig ?? "—"} · ` +
    (concordam === null ? "sem medição escrita" : concordam ? "concorda" : `DIVERGE da série`);
  caixa.innerHTML = `
    <div class="mini fraco">as últimas barras fechadas — a barra que decidiu é a última</div>
    <div class="tabela-de-barras mono">
      <div class="linha cabeca"><span>barra (local)</span><span>mid</span><span>ma</span><span>mid−ma</span><span>atr</span><span>banda</span><span>sig</span></div>
      ${últimas.map((x) => {
        const midMenosMa = x.ma === null || x.mid === undefined ? "na" : (x.mid - x.ma).toFixed(4);
        return `<div class="linha">
          <span class="fraco">${diaEHora(x.t)}</span>
          <span>${x.mid === undefined ? "—" : Number(x.mid).toFixed(4)}</span>
          <span>${x.ma === null ? "na" : x.ma.toFixed(4)}</span>
          <span>${midMenosMa}</span>
          <span>${x.atr === null ? "na" : x.atr.toFixed(4)}</span>
          <span>${x.banda === null ? "na" : x.banda.toFixed(4)}</span>
          <span class="${x.sig === 1 ? "sig-compra" : x.sig === -1 ? "sig-venda" : ""}">${x.sig}${x.virada !== 0 ? " ⟵ virou" : ""}</span>
        </div>`;
      }).join("")}
    </div>
    ${dito.veredicto
      ? `<div class="dito mono"><b>O setup disse</b> (volta ${escapar(dito.veredicto.volta)})${dito.veredicto.proposta_do_setup ? ` · propôs <b>${escapar(dito.veredicto.lado_da_proposta)}</b>` : " · não propôs nada"}: ${escapar(dito.veredicto.texto)}</div>`
      : `<div class="dito fraco">o setup não falou em nenhuma volta do operador nesta corrida</div>`}
    ${med
      ? `<div class="mini fraco" style="margin-top:6px">
           última medição escrita por ele: volta ${escapar(med.volta)} · sig ${escapar(med.sig)} · virada ${escapar(med.virada)} · ma ${escapar(med.ma)} · atr ${escapar(med.atr)}
           ${concordam === null ? "" : concordam
             ? `<span class="selo vivo sem-ponto" style="margin-left:6px">concorda com a série</span>`
             : `<span class="selo teste sem-ponto" style="margin-left:6px">DIVERGE da série (série diz sig ${escapar(sig)})</span>`}
         </div>`
      : ""}`;
}

/* ========================= A CONFIGURAÇÃO, EM DIÁLOGO =================== *
 *
 * A configuração de um par é o que MENOS se olha e o que mais explica o resto — e estava a ocupar um terço da
 * coluna da direita com dezassete campos que se lêem de vez em quando. Passou a um diálogo, aberto pelo botão ao
 * lado do símbolo no título do gráfico: fica na mesma linha de vista do par que se está a olhar.
 *
 * O QUE NÃO MUDA, e é o que importa: os itens continuam a sair do TEMPLATE do próprio setup (RN-S4) — a tela não
 * conhece um item por nome —, e continuam **somente leitura** nesta fatia (a escrita exige validação e
 * assinatura, RN-E12/RN-M2). O que muda é onde eles moram no ecrã, não o que a tela sabe.
 */
function conteudoDaConfiguracao(i) {
  const descritores = i.template ?? {};
  const valores = { ...(i.valores_resolvidos ?? {}), ...(i.parametros ?? {}) };
  const itens = Object.entries(descritores).map(([nome, d]) => {
    const valor = valores[nome] ?? d.omissao;
    // SEM `input` NEM `select`, mesmo desactivados: um controle desactivado é um controle que FINGE — parece que
    // se muda ali e não se muda. Num campo somente-leitura o valor é TEXTO, e ao lado dele vão as opções que
    // existem (para se saber o que se estaria a escolher no dia em que a escrita existir).
    const naoDeclarado = valor === undefined || valor === null || valor === "";
    const mostra = d.tipo === "booleano" ? (valor ? "sim" : "não") : (naoDeclarado ? "(não declarado)" : String(valor));
    const escolhas = d.tipo === "escolha" && Array.isArray(d.opcoes)
      ? `<small class="opcoes">opções: ${d.opcoes.map((o) => escapar(o)).join(" · ")}</small>`
      : "";
    return `<div class="item-de-config">
        <span class="nome-do-item mono">${escapar(nome)}<small>${escapar(d.tipo ?? "")}${d.unidade ? " · " + escapar(d.unidade) : ""}${d.nota ? " · " + escapar(d.nota) : ""}</small></span>
        <span class="valor mono"><b class="${naoDeclarado ? "fraco" : ""}">${escapar(mostra)}</b>${escolhas}</span>
      </div>`;
  }).join("");

  const f = i.ficha ?? {};
  return `
    <div class="secao">
      <h3>Os itens do setup · ${Object.keys(descritores).length} · a partir do template</h3>
      <div class="dentro-da-secao">
        ${itens || "<span class='fraco'>o setup não publica template — sem ele não há item nenhum a mostrar</span>"}
      </div>
    </div>

    <div class="secao">
      <h3>De onde vem esta configuração</h3>
      <div class="dentro-da-secao">
        <dl class="pares mono">
          <dt>ficha</dt><dd>${escapar(f.caminho ?? "—")}</dd>
          <dt>conta</dt><dd>${escapar(i.conta ?? "—")}</dd>
          <dt>setup</dt><dd>${escapar(f.setup ?? "—")} ${escapar(f.versao_do_setup ?? "")} ${f.linguagem ? `(${escapar(f.linguagem)})` : ""}</dd>
          <dt>relógio</dt><dd>${escapar(f.relogio ?? "—")} <span class="fraco">(é da ficha, não do setup)</span></dd>
          <dt>ao desligar</dt><dd>${escapar(f.ao_desligar ?? "—")}</dd>
        </dl>
      </div>
    </div>

    <div class="secao">
      <h3>Os dois interruptores</h3>
      <div class="dentro-da-secao">
        <dl class="pares mono">
          <dt>rodar (o par está na operação)</dt><dd class="${f.run ? "sig-compra" : "fraco"}">${f.run === true ? "sim" : f.run === false ? "não" : "não declarado"}</dd>
          <dt>enviar (a mesa pode mandar ao venue)</dt><dd class="${f.enviar ? "sig-venda" : "fraco"}">${f.enviar === true ? "sim" : f.enviar === false ? "não" : "não declarado"}</dd>
        </dl>
        <div class="mini fraco" style="margin-top:8px">
          Somente leitura nesta fatia — a escrita pela tela exige validação e assinatura (RN-E12, RN-M2). O passo
          que muda o estado é este, por par:
        </div>
        <code class="comando mono">bash tools/ligar-par.sh ${escapar(i.instrumento)} ${f.run ? "nao" : "sim"}</code>
        <code class="comando mono"># e o gatilho, na ficha: "enviar": ${f.enviar ? "false" : "true"}</code>
      </div>
    </div>`;
}

let ultimoFocoAntesDoDialogo = null;

function abrirConfiguracao() {
  const i = instrumentoAtual();
  if (!i) return;
  document.getElementById("dialogo-titulo").textContent = `configuração · ${i.instrumento} · ${i.ficha?.setup ?? "?"} ${i.ficha?.versao_do_setup ?? ""}`;
  document.getElementById("dialogo-corpo").innerHTML = conteudoDaConfiguracao(i);
  ultimoFocoAntesDoDialogo = document.activeElement;
  document.getElementById("veu").hidden = false;
  document.getElementById("dialogo").hidden = false;
  // Travar a rolagem do fundo: num telefone, o dedo que rola dentro de uma folha acaba a mexer na página de trás.
  document.body.style.overflow = "hidden";
  document.getElementById("fechar-dialogo").focus();
}

function fecharConfiguracao() {
  document.getElementById("dialogo").hidden = true;
  document.getElementById("veu").hidden = true;
  document.body.style.overflow = "";
  // O foco volta a quem abriu: sem isto, quem anda de teclado cai no início da página e perde o sítio. Quando o
  // que estava focado era o `body` (abertura por gesto indirecto), volta ao botão que abre — nunca a nada.
  const alvo = ultimoFocoAntesDoDialogo && ultimoFocoAntesDoDialogo !== document.body ? ultimoFocoAntesDoDialogo : document.getElementById("bt-config");
  if (alvo && alvo.focus) alvo.focus();
  ultimoFocoAntesDoDialogo = null;
}
