<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1a1f">
<link rel="icon" href="data:,">
<title>MesaCore · painel</title>
<link rel="stylesheet" href="tema.css">
<style>
  /* ==========================================================================================
   * UM TERMINAL, NÃO UMA PÁGINA.
   *
   * A regra é DENSIDADE: linha de 20-22 px, padding de 2 a 6 px, número tabular alinhado à
   * direita, e zero parágrafos. O que era um parágrafo virou COLUNA (o motivo que trava é um
   * código em `TRAVA`, com o texto no `title`); o que era cabeçalho de secção com slogan morreu,
   * porque um cabeçalho que não transporta dados é espaço roubado aos dados.
   *
   * E o ecrã é UM: barra de estado (o que muda depressa) · área de trabalho (pares | gráfico |
   * posições) · rodapé (a matriz de estado, a leitura, o ledger). Sem rolagem de página no
   * computador — quem rola é o interior de cada coluna.
   * ========================================================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--fundo); color: var(--tinta); font-family: var(--fonte-da-tela);
    font-size: 12px; line-height: 1.35; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100vh; overflow: hidden;
  }
  .mono { font-family: var(--fonte); font-variant-numeric: tabular-nums; }
  .fraco { color: var(--tinta-fraca); }
  .fantasma { color: var(--tinta-fantasma); }
  .rot { color: var(--tinta-fraca); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  /* A FONTE E A IDADE DE CADA BLOCO: uma linha pequena na cabeça, com o caminho e há quanto tempo o ficheiro foi
     escrito. Escrita pequena porque é contexto, e VERMELHA quando o dado envelhece — um número sem a fonte e sem a
     hora não serve para decidir (medido: «lido há 7,6 h» sem dizer de que corrida nem de que ficheiro). */
  .fonte { font-size: 9.5px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; max-width: 100%; }
  a { color: var(--compra-suave); }
  h1, h2, h3, h4 { margin: 0; font-size: 12px; font-weight: 600; }

  /* ---------- selo e lado: pílulas de 16 px, sem cerimónia ---------- */
  .selo {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    padding: 0 5px; border-radius: 2px; border: 1px solid var(--borda); background: var(--painel);
    color: var(--tinta-fraca); font-size: 10px; letter-spacing: .03em; text-transform: uppercase;
  }
  .selo.vivo { color: var(--compra-suave); border-color: color-mix(in srgb, var(--compra-suave) 45%, transparent); }
  .selo.teste { color: var(--venda); border-color: color-mix(in srgb, var(--venda) 45%, transparent); }
  .selo.parado { color: var(--neutro); }
  .selo::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
  .selo.sem-ponto::before { display: none; }
  .lado {
    display: inline-flex; align-items: center; justify-content: center; min-width: 32px; padding: 0 4px;
    border-radius: 2px; font-size: 9.5px; letter-spacing: .03em; text-transform: uppercase; font-weight: 700;
  }
  .lado.compra { background: color-mix(in srgb, var(--compra) 85%, transparent); color: var(--tinta-no-acento); }
  .lado.venda { background: color-mix(in srgb, var(--venda) 85%, transparent); color: var(--tinta-no-acento); }
  .lado.neutro { background: var(--painel-alto); color: var(--neutro); }
  .compra-txt { color: var(--compra-suave); }
  .venda-txt { color: var(--venda); }
  .glifo { display: inline-block; width: 9px; height: 9px; flex: none; }
  .glifo.tri-cima { clip-path: polygon(50% 0, 100% 100%, 0 100%); background: var(--compra); }
  .glifo.tri-baixo { clip-path: polygon(50% 100%, 100% 0, 0 0); background: var(--venda); }
  .glifo.chevron { width: 9px; height: 9px; background: currentColor; clip-path: polygon(50% 62%, 4% 20%, 4% 40%, 50% 82%, 96% 40%, 96% 20%); }
  .glifo.chevron.aberto { clip-path: polygon(50% 38%, 4% 80%, 4% 60%, 50% 18%, 96% 60%, 96% 80%); }
  /* O VÃO DO HISTÓRICO: um vao REAL entre velas, NOMEADO (de/ate + quantas faltam). Pinta-se de venda porque e'
     uma falta — nao se inventa a barra que faltou nem se atravessa o vao em silencio. */
  .vao { color: var(--venda); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46ch; }

  /* ======================= A BARRA DE ESTADO (uma faixa, o que muda depressa) ============== */
  /* DUAS LINHAS, DECIDIDAS: a primeira é a IDENTIDADE (produto · corrida · ambiente · estado · atenção), a
     segunda são os NÚMEROS. As duas começam à esquerda e ocupam a largura toda — sem `margin-left:auto`, que
     é o que produzia uma linha 2 a começar a meio (medido: 417 px de vazio à esquerda) e fazia a faixa parecer
     um painel sem nome. Nada de rótulos órfãos: o plugin saiu daqui (vive no cabeçalho do gráfico). */
  .fita {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 1px 12px; padding: 3px 10px;
    background: var(--painel-alto); border-bottom: 1px solid var(--borda);
  }
  .fita .marca { display: flex; align-items: baseline; gap: 7px; flex: 1 1 100%; min-width: 0; }
  .fita .marca b { color: var(--titulo); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  /* A CORRIDA É O TÍTULO: a primeira pergunta do dono é «de que corrida é isto?», e por isso é ela que
     manda na hierarquia — o nome do produto encolheu para uma etiqueta. */
  .fita .marca b.corrida { font-size: 13.5px; letter-spacing: .01em; text-transform: none; white-space: nowrap; }
  .numeros-da-fita { display: flex; flex-wrap: wrap; gap: 1px 12px; flex: 1 1 100%; align-items: baseline; min-width: 0; }
  .numero { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .numero .rot { font-size: 9.5px; }
  .numero .val { color: var(--tinta); font-size: 12.5px; font-family: var(--fonte); font-variant-numeric: tabular-nums; }
  .numero.seletor select {
    max-width: 250px; padding: 0 4px; min-height: 21px;
    background: var(--painel); color: var(--tinta);
    border: 1px solid var(--borda); border-radius: 2px; font: inherit; font-size: 11.5px;
  }
  .botao {
    min-height: 21px; padding: 0 8px; background: var(--painel); color: var(--tinta);
    border: 1px solid var(--borda); border-radius: 2px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .botao:hover { border-color: var(--tinta-fraca); }

  /* ======================= A ÁREA DE TRABALHO (três colunas, 1 px de separador) =========== */
  .area {
    display: grid; grid-template-columns: 190px minmax(0, 1fr) 306px;
    gap: 1px; background: var(--borda); min-height: 0; overflow: hidden;
  }
  .col { background: var(--fundo); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cabeca-da-col {
    display: flex; align-items: center; gap: 6px; flex: none; flex-wrap: wrap;
    padding: 1px 8px; min-height: 19px;
    background: var(--painel); border-bottom: 1px solid var(--divisor);
  }
  .cabeca-da-col .contagem { margin-left: auto; color: var(--tinta-fraca); font-size: 10px; text-transform: none; letter-spacing: 0; }
  .corpo-rolavel { overflow: auto; min-height: 0; }

  /* ---------- a matriz de pares ---------- */
  .matriz .lh, .matriz .lr { display: grid; grid-template-columns: 1fr 62px 34px; align-items: center; gap: 4px; padding: 2px 8px; }
  .matriz .lh { border-bottom: 1px solid var(--divisor); }
  .matriz .lr { border-bottom: 1px solid var(--divisor); cursor: pointer; min-height: 21px; }
  .matriz .lr:hover { background: var(--painel); }
  .matriz .lr[aria-selected="true"] { background: var(--painel); box-shadow: inset 2px 0 0 var(--compra-suave); }
  .matriz .lr .par { color: var(--titulo); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .matriz .lr .preco { text-align: right; font-family: var(--fonte); font-variant-numeric: tabular-nums; }
  .matriz .lr .estado { text-align: center; }

  /* ---------- o gráfico ---------- */
  .col-grafico .cabecalho {
    display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; flex: none;
    padding: 3px 10px; border-bottom: 1px solid var(--divisor);
  }
  .col-grafico .cabecalho .titulo { color: var(--titulo); font-size: 14px; font-weight: 700; }
  .col-grafico .palco { flex: 1; min-height: 0; }
  .legenda-do-grafico {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px 14px; flex: none;
    padding: 2px 10px; border-top: 1px solid var(--divisor); color: var(--tinta-fraca); font-size: 10.5px;
  }
  .legenda-do-grafico > span { display: inline-flex; align-items: center; gap: 4px; }
  .alternar { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--tinta-fraca); }
  .alternar input { accent-color: var(--compra-suave); width: 12px; height: 12px; }

  /* ---------- tabelas densas ---------- */
  table.tab { width: 100%; border-collapse: collapse; font-family: var(--fonte); font-variant-numeric: tabular-nums; }
  table.tab th {
    text-align: left; font-weight: 500; color: var(--tinta-fraca);
    font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase;
    padding: 1px 8px; border-bottom: 1px solid var(--divisor); white-space: nowrap;
  }
  table.tab td { padding: 2px 8px; border-bottom: 1px solid var(--divisor); white-space: nowrap; }
  /* UMA CÉLULA QUE PODE QUEBRAR: os motivos (`nada:proposta_ausente_tratada_como_hold`) são longos e, com
     `nowrap`, empurravam a tabela para fora da coluna (medido: 351 > 306 px). */
  table.tab td.quebra { white-space: normal; overflow-wrap: anywhere; }
  table.tab td.n, table.tab th.n { text-align: right; }
  table.tab tr:last-child td { border-bottom: 0; }
  table.tab tr.vazio td { color: var(--tinta-fantasma); }
  table.tab tr.parado td { box-shadow: inset 2px 0 0 var(--venda); }

  /* ---------- o rodapé ---------- */
  .rodape {
    display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px; background: var(--borda); border-top: 1px solid var(--borda);
    max-height: 40vh; overflow: hidden;
  }
  .rodape > div { background: var(--fundo); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .rodape h4 {
    display: flex; align-items: center; gap: 6px; flex: none; flex-wrap: wrap;
    padding: 1px 8px; min-height: 19px; background: var(--painel); border-bottom: 1px solid var(--divisor);
    color: var(--tinta-fraca); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 500;
  }
  .rodape h4 .contagem { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 10px; }
  .rodape .dentro-do-bloco { overflow: auto; min-height: 0; }
  .faltas .falta { display: flex; gap: 8px; padding: 2px 8px; border-bottom: 1px solid var(--divisor); }
  .faltas .falta b { color: var(--venda); font-weight: 600; white-space: nowrap; }

  .abre-o-card {
    margin-left: auto; flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; padding: 0; background: transparent; color: var(--tinta-fraca);
    border: 1px solid var(--borda); border-radius: 2px; cursor: pointer;
  }
  .abre-o-card:hover { color: var(--tinta); border-color: var(--tinta-fraca); }
  /* RECOLHIDO: só a cabeça do bloco fica. A CABEÇA DECLARA-SE com a classe `.cabeca` — não se adivinha pela tag.
     A regra antiga conservava `<header>`/`<h4>` e escondia tudo o resto; as três secções do «lado de dentro»
     nascem com `<h3>`, logo recolhiam e DESAPARECIAM INTEIRAS — com o botão de abrir dentro da cabeça escondida
     (medido a 03/10/2026: o dono recolheu e perdeu a tela, sem forma de a reabrir).
     INVARIANTE: quem escreve uma secção recolhível põe `.cabeca` na cabeça, e o botão DENTRO dela. */
  [data-recolhivel].recolhido > :not(.cabeca):not(header):not(h4) { display: none; }

  /* ---------- a vista ---------- */
  /* O DIÁLOGO DE CONFIGURAÇÃO SAIU (04/10/2026). Ele era uma SEGUNDA porta para a mesma configuração — só leitura,
     aberto pelo botão `config` do gráfico, que dizia o mesmo que a vista `#configuracao` num sítio onde não se
     editava nada. O que muda um DOCUMENTO vai a VISTA, não a diálogo: o botão `config` passou a ser um
     `<a href="#configuracao">`, e esta vista é o único sítio onde a ficha se lê e se edita. (O CSS e o HTML do
     diálogo saíram com ele — não fica código morto a fingir que existe uma caixa.) */

  .vista-de-config { padding: 8px; display: flex; flex-direction: column; gap: 6px; grid-row: 2 / 4; overflow: hidden; }
  /* A FAIXA DOS COMANDOS TEM DE ESTAR NO ECRÃ, não abaixo da dobra: o `#config-corpo` é uma grelha de duas
     linhas (o painel · as ações) e é a primeira que encolhe. Sem isto, a faixa existia no DOM e não se via —
     medido: `acoes: 3` elementos presentes e nenhum visível na captura. */
  #config-corpo { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 1px; flex: 1 1 auto; min-height: 0; }
  .config-grade { min-height: 0; }
  .relatorio-do-conferidor { max-height: 16vh; }
  /* O `hidden` NÃO ESCONDE SOZINHO: a regra de classe (`display:flex`) ganha-lhe, e o resultado era um painel
     INVISÍVEL de 1440x16 logo abaixo da barra — presente no ecrã, impossível de identificar, e a roubar uma
     linha da grelha. Medido: `hidden:true, display:flex, y:53, h:16`. */
  .vista-de-config[hidden] { display: none; }

  /* ---------------- A VISTA DE CONFIGURAÇÃO É UM DASH, NÃO UM DOCUMENTO ----------------
     A mesma medicina do terminal: uma grelha com três colunas (as fichas · a ficha escolhida · o conferidor e a
     escrita) e uma faixa de AÇÕES por baixo. Nenhum parágrafo: o que era explicação virou `title`, coluna ou
     saiu — «o segredo não passa por aqui» custava três linhas para dizer uma coisa que a linha `segredo` já diz. */
  .config-grade { display: grid; grid-template-columns: 208px minmax(0, 1fr) 330px; gap: 1px; background: var(--borda); min-height: 0; }
  .config-grade > .col { min-width: 0; }
  /* a lista da esquerda: a MESMA matriz dos pares, com duas colunas em vez de três */
  .matriz.solta .lh, .matriz.solta .lr { grid-template-columns: 1fr auto; }
  .matriz.solta .lr .grupo { grid-column: 1 / -1; }
  .matriz .lh.grupo { color: var(--tinta-fantasma); }
  .acoes-grade { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--borda); flex: none; }
  .acoes-grade > div { background: var(--fundo); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .acoes-grade h4 { padding: 1px 8px; min-height: 19px; background: var(--painel); border-bottom: 1px solid var(--divisor); color: var(--tinta-fraca); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .acoes-grade h4 .contagem { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 10px; }
  .acoes-grade .dentro { padding: 3px 8px 5px; overflow: auto; max-height: 22vh; }
  .linha-de-acao { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .linha-de-acao .quem { color: var(--titulo); font-weight: 600; min-width: 62px; }
  .linha-de-acao .com { flex: 1; min-width: 0; color: var(--tinta-fraca); font-family: var(--fonte); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* os botões de CRIAR vivem no fundo da coluna do inventário: é ali que a pergunta nasce («falta uma ficha») */
  .nova-linha { display: flex; gap: 4px; flex-wrap: wrap; padding: 3px 8px; border-top: 1px solid var(--divisor); flex: none; }
  .nova-linha .botao { font-size: 10.5px; padding: 0 6px; }
  .pedido { display: flex; align-items: baseline; gap: 6px; padding: 1px 0; border-bottom: 1px solid var(--divisor); }
  .pedido .quando { color: var(--tinta-fantasma); }
  .pedido .oque { flex: 1; min-width: 0; }
  .pendente { border-left: 2px solid var(--neutro); background: color-mix(in srgb, var(--neutro) 7%, transparent); }
  body[data-vista="configuracao"] .fita,
  body[data-vista="configuracao"] .area,
  body[data-vista="configuracao"] .rodape,
  body[data-vista="configuracao"] .faltas,
  body[data-vista="configuracao"] .barra-do-telefone { display: none; }
  .cabeca-da-vista { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cabeca-da-vista h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .cabeca-da-vista .botao { margin-left: auto; }
  .item-de-config { display: grid; grid-template-columns: minmax(140px, 320px) 1fr; gap: 0 10px; padding: 1px 0; border-bottom: 1px solid var(--divisor); }
  .item-de-config .nome-do-item { color: var(--tinta-fraca); }
  .item-de-config .nome-do-item small { display: block; color: var(--tinta-fantasma); font-size: 10px; }
  .item-de-config .valor { text-align: right; overflow-wrap: anywhere; }
  .item-de-config .valor b { color: var(--tinta); font-weight: 600; }
  .item-de-config .valor b.fraco { color: var(--tinta-fraca); font-weight: 400; }
  .item-de-config .valor .opcoes { display: block; color: var(--tinta-fantasma); font-size: 10px; }
  .vista-de-config input[type="text"], .vista-de-config input[type="password"], .vista-de-config select {
    width: 100%; min-height: 24px; padding: 2px 5px; background: var(--fundo); color: var(--tinta);
    border: 1px solid var(--tinta-fantasma); border-radius: 2px; font: inherit;
  }
  .vista-de-config input[type="text"]:focus, .vista-de-config select:focus { outline: 2px solid var(--compra-suave); outline-offset: 1px; }
  .botoes-da-ficha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .botao.escreve { background: var(--compra-suave); color: var(--tinta-no-acento); border-color: var(--compra); font-weight: 600; }
  .resultado { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 2px; }
  .resultado.bom { border-color: var(--compra-suave); }
  .resultado.mau { border-color: var(--venda); }
  .resultado .item-de-config { border-bottom: 0; }
  .relatorio { margin-top: 4px; }
  .relatorio summary { cursor: pointer; color: var(--tinta-fraca); }
  .comando { display: block; margin-top: 4px; padding: 4px 6px; background: var(--fundo); border: 1px solid var(--borda); border-radius: 2px; color: var(--compra-suave); overflow-wrap: anywhere; }
  .relatorio-do-conferidor {
    margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--fonte);
    font-size: 11px; line-height: 1.45; max-height: 300px; overflow: auto; padding: 6px 8px;
    background: var(--painel); border-radius: 2px;
  }
  .caminho-da-ficha { color: var(--tinta-fraca); font-size: 10px; }
  .aviso { padding: 4px 8px; border-left: 2px solid var(--venda); background: color-mix(in srgb, var(--venda) 8%, transparent); }
  .mini { font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; }
  .nota { font-size: 11px; line-height: 1.45; }
  .dito { padding: 2px 8px; border-left: 2px solid var(--borda); background: var(--painel); color: var(--tinta-fraca); }
  dl.pares { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; margin: 0; padding: 2px 8px 6px; }
  dl.pares dt { color: var(--tinta-fraca); }
  dl.pares dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-family: var(--fonte); font-variant-numeric: tabular-nums; }
  .secao { border-bottom: 1px solid var(--divisor); }
  .secao > h3 { padding: 2px 8px; font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-fraca); background: var(--painel); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .secao > h3 > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .secao > .dentro-da-secao { padding: 3px 8px 6px; }

  /* ---------- a coluna da direita: duas gavetas ---------- */
  #col-lado > .bloco { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; }
  #vivas .corpo-rolavel { max-height: 46vh; }
  #dentro { flex: 1 1 auto; }
  /* A COLUNA DA DIREITA É ESTREITA (306 px): a tabela respira menos, e é isso que faz as cinco colunas caberem
     sem o cabeçalho sair cortado. Medido antes: seis colunas com padding de 8 px davam «DECIS?». */
  #vivas-corpo table.tab td, #vivas-corpo table.tab th { padding: 2px 4px; font-size: 11px; }
  #vivas-corpo table.tab td:first-child, #vivas-corpo table.tab th:first-child { padding-left: 8px; }

  /* ============================ O TELEFONE ================================================ */
  .barra-do-telefone { display: none; }
  @media (max-width: 1080px) {
    /* A BARRA NO TELEFONE: menos pedaços, e mais pequenos. Saem os que já estão noutro sítio do ecrã (o
       plugin, os ciclos e os pares), e o rótulo do seletor — o select já mostra a corrida. Medido antes:
       cinco linhas de barra empurravam o gráfico para o fundo da dobra. */
    .fita { padding: 2px 8px; gap: 2px 10px; min-height: 0; }
    /* A MARCA PARTE-SE POR LINHAS INTEIRAS: a corrida e os selos cabem na primeira, e a ATENÇÃO — que é a mais
       longa («sem dados há 3,4 h») — ganha a sua própria linha, em vez de espremer o nome da corrida até o
       partir a meio (medido antes: «teste-de-» / «auditoria»). */
    .fita .marca { flex-wrap: wrap; gap: 3px 7px; }
    .fita .marca .selo.atencao { flex: 1 1 100%; }
    .fita .marca .plugin, .fita .numero.ciclos, .fita .numero.pares, .fita .numero.agora, label.numero.seletor .rot { display: none; }
    .numeros-da-fita { gap: 1px 10px; }
    .numero .rot { font-size: 8.5px; letter-spacing: .02em; }
    .numero .val { font-size: 11.5px; }
    body { display: block; height: auto; min-height: 100vh; overflow: visible; }
    /* A VISTA DE CONFIGURAÇÃO, NO TELEFONE: uma coluna. A grelha de três colunas dá 540 px num ecrã de 390, e
       o que transborda não se lê — medido: `config-grade 540>374`, e as linhas de ação a 171>124. */
    .config-grade { grid-template-columns: 1fr; }
    .config-grade > .col { max-height: none; }
    .acoes-grade { grid-template-columns: 1fr; }
    .acoes-grade .dentro { max-height: none; }
    .linha-de-acao .com { display: none; }
    .config-grade .matriz .lr { min-height: 44px; }
    .area { grid-template-columns: 1fr; height: auto; overflow: visible; }
    .col { height: auto; }
    .col-grafico .palco { height: 52vh; min-height: 250px; }
    .rodape { grid-template-columns: 1fr; max-height: none; overflow: visible; }
    /* O CONTEÚDO CONTINUA A ROLAR DENTRO DO BLOCO, mesmo no telefone: a tabela da leitura tem 7 colunas
       `nowrap` (~620 px) e, com `overflow: visible`, empurrava a PÁGINA inteira (medido: doc 624 > 500). */
    .rodape .dentro-do-bloco { max-height: none; }
    #vivas .corpo-rolavel { max-height: none; }
    /* no telefone o bloco dos pares é uma faixa horizontal — escolhe-se com o polegar */
    #col-pares .corpo-rolavel { overflow-x: auto; }
    .matriz { flex-direction: row; }
    .matriz .lh { display: none; }
    .matriz .lr { grid-template-columns: auto auto 34px; min-width: 150px; min-height: 32px; border-right: 1px solid var(--divisor); border-bottom: 0; }
    table.tab td, table.tab th { padding: 4px 8px; }
    /* A RÉGUA DA CASA NO TELEFONE É ≥44 px — medido a 04/10/2026: os botões desta vista tinham 21 px no computador
       e 30 px no telefone, abaixo de tudo. A caixa cresce, o rótulo cresce, o gesto acerta. */
    .botao { min-height: 44px; }
    .numero.seletor select { min-height: 44px; max-width: 46%; }
    .alternar { min-height: 44px; }
    .alternar input { width: 16px; height: 16px; }
    .abre-o-card { width: 44px; height: 44px; }
    .barra-do-telefone {
      display: flex; gap: 6px; align-items: center; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
      background: var(--painel-alto); border-top: 1px solid var(--borda);
    }
    .barra-do-telefone .quem { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .barra-do-telefone .botao { flex: none; }
    .faltas { padding-bottom: 60px; }
    /* A GRELHA DE UM ITEM EM DUAS COLUNAS NAO CABE NUM ECRÃ DE 390: um item por linha, valor à esquerda. Vale para
       o resultado de uma escrita (`.item-de-config`), que é onde isto ainda aparece. */
    .item-de-config { grid-template-columns: 1fr; }
    .item-de-config .valor { text-align: left; }
  }
</style>
</head>
<body>

<!-- A BARRA DE ESTADO: o que muda depressa, numa faixa. Sem slogans. -->
<header class="fita" id="fita"></header>

<!-- A ÁREA DE TRABALHO: pares | gráfico (dominante) | posições · ordens · mercado. -->
<main class="area">
  <aside class="col" id="col-pares">
    <header class="cabeca-da-col"><span class="rot">Pares</span><span class="contagem" id="contagem-de-pares"></span></header>
    <div class="corpo-rolavel"><div class="matriz" id="lista-de-pares" role="listbox" aria-label="pares em negociação"></div></div>
  </aside>

  <section class="col col-grafico">
    <div class="cabecalho" id="cabecalho-do-grafico"></div>
    <div class="palco" id="palco"></div>
    <div class="legenda-do-grafico" id="legenda"></div>
  </section>

  <aside class="col" id="col-lado">
    <div class="bloco" data-recolhivel="vivas" id="vivas">
      <header class="cabeca-da-col">
        <span class="rot">Posições vivas</span><span class="contagem" id="contagem-das-vivas"></span>
        <span class="fonte" id="fonte-das-vivas"></span>
        <button type="button" class="abre-o-card" data-alternar="vivas" aria-expanded="true" aria-label="posições vivas: recolher"><i class="glifo chevron aberto"></i></button>
      </header>
      <div class="corpo-rolavel" id="vivas-corpo"></div>
    </div>
    <div class="corpo-rolavel" id="dentro"></div>
  </aside>
</main>

<!-- O RODAPÉ: a matriz de estado (em vez de frases), a leitura do setup, o ledger. -->
<footer class="rodape">
  <div class="bloco" data-recolhivel="matriz">
    <h4>Estado por par <span class="contagem" id="contagem-da-matriz"></span>
      <span class="fonte" id="fonte-da-matriz"></span>
      <button type="button" class="abre-o-card" data-alternar="matriz" aria-expanded="true" aria-label="a matriz de estado: recolher"><i class="glifo chevron aberto"></i></button></h4>
    <div class="dentro-do-bloco" id="matriz"></div>
  </div>
  <div class="bloco" data-recolhivel="leitura">
    <h4>A leitura do setup <span class="contagem" id="resumo-da-leitura"></span>
      <span class="fonte" id="fonte-da-leitura"></span>
      <button type="button" class="abre-o-card" data-alternar="leitura" aria-expanded="true" aria-label="a leitura do setup: recolher"><i class="glifo chevron aberto"></i></button></h4>
    <div class="dentro-do-bloco" id="corpo-da-leitura"></div>
  </div>
  <div class="bloco" data-recolhivel="registo">
    <h4>Registo · mandato · carteiro <span class="contagem" id="contagem-do-registo"></span>
      <span class="fonte" id="fonte-do-registo"></span>
      <button type="button" class="abre-o-card" data-alternar="registo" aria-expanded="true" aria-label="o registo: recolher"><i class="glifo chevron aberto"></i></button></h4>
    <div class="dentro-do-bloco" id="registo"></div>
  </div>
</footer>

<section class="faltas" id="faltas"></section>

<!-- A VISTA DE CONFIGURAÇÃO — um documento tem vista própria (endereço `#configuracao`), não uma caixa. -->
<section class="vista-de-config" id="vista-de-config" hidden>
  <header class="cabeca-da-vista">
    <h1>Configuração</h1>
    <span class="mini fraco" id="config-do-retrato"></span>
    <a class="botao" id="voltar-ao-painel" href="#">voltar ao painel</a>
  </header>
  <div id="config-corpo"></div>
</section>

<div class="barra-do-telefone" id="barra-do-telefone"></div>

<!-- A BIBLIOTECA DO GRÁFICO vem antes dos módulos: um `<script>` clássico corre durante a análise, e os
     módulos (diferidos) correm depois — `LightweightCharts` existe quando `js/grafico.js` o lê. -->
<script src="lightweight-charts.standalone.production.js"></script>
<script type="module" src="js/arranque.js"></script>
</body>
</html>
